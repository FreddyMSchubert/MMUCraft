syntax = "proto3";

package mcstack.gameplay.v1;

option java_multiple_files = true;
option java_package = "uk.co.httpsmmuminecraftsociety.mainmod.grpc";
option java_outer_classname = "GameplayProto";

service GameplayEvents {
  rpc UnlockNextKnowledge(UnlockNextKnowledgeRequest) returns (UnlockNextKnowledgeResponse);
}

service GameplayControl {
  rpc GrantDailyLoginBonus(GrantDailyLoginBonusRequest) returns (GrantDailyLoginBonusResponse);
}

message UnlockNextKnowledgeRequest {
  string minecraft_username = 1;
  string source_item_id = 2;
  int64 unix_ms = 3;
}

message UnlockNextKnowledgeResponse {
  bool unlocked = 1;
  bool all_unlocked = 2;
  string knowledge_id = 3;
  int32 priority = 4;
  string topic = 5;
  string message = 6;
}

message GrantDailyLoginBonusRequest {
  string minecraft_username = 1;
  int32 amount = 2;
  string period_key = 3;
  int64 unix_ms = 4;
}

message GrantDailyLoginBonusResponse {
  bool granted = 1;
  bool online = 2;
  string message = 3;
}
