name: deploy
run-name: >-
    ${{ github.event_name == 'schedule' && 'Check due carbon deploys' || format('{0} {1} to {2}', github.event_name == 'workflow_dispatch' && inputs.carbon_aware && 'Plan' || 'Deploy', github.event_name == 'repository_dispatch' && format('planned #{0}', github.event.client_payload.artifact_id) || github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.version, github.event_name == 'repository_dispatch' && github.event.client_payload.target || github.event_name == 'workflow_run' && 'dev' || inputs.target) }}

on:
    schedule:
        - cron: '2/5 * * * *'
    workflow_run:
        workflows: [checks-tests-images]
        types: [completed]
        branches: [main]
    workflow_dispatch:
        inputs:
            target:
                description: Server to update (dev or production)
                required: true
                default: dev
                type: choice
                options:
                    - dev
                    - production
            version:
                description: Build to deploy; dev = latest dev build, SHA = specific build, release tag = published release
                required: true
                default: dev
                type: string
            source_ref:
                description: Deployment files for release tags; blank uses Version. Dev and SHA use their build commit.
                required: false
                default: ''
                type: string
            warning_minutes:
                description: Wait up to this many minutes for players to leave after a warning; 0 skips the advance warning
                required: true
                default: 3
                type: number
            force:
                description: Continue if player notices, disconnects, or saving fails; all are still attempted
                required: true
                default: false
                type: boolean
            carbon_aware:
                description: Let CATS choose a deploy time before 07:00 UK time tomorrow
                required: true
                default: false
                type: boolean
    repository_dispatch:
        types: [carbon-aware-deploy]

permissions:
    contents: read
    packages: read

concurrency:
    group: deploy-${{ github.event_name == 'schedule' && 'scheduler' || github.event_name == 'repository_dispatch' && github.event.client_payload.target || github.event_name == 'workflow_run' && 'dev' || inputs.target }}
    cancel-in-progress: false

jobs:
    plan:
        if: >-
            github.event_name == 'workflow_dispatch' && inputs.carbon_aware &&
            (inputs.target == 'dev' ||
             (github.actor == 'FreddyMSchubert' && github.triggering_actor == 'FreddyMSchubert'))
        runs-on: ubuntu-24.04
        permissions:
            actions: write
            contents: read
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - uses: actions/setup-python@v6
              with:
                  python-version: '3.12'

            - name: Install CATS
              run: python -m pip install climate-aware-task-scheduler==1.2.1

            - name: Choose deployment time
              env:
                  PLAN_TARGET: ${{ inputs.target }}
                  PLAN_VERSION: ${{ inputs.version }}
                  PLAN_SOURCE_REF: ${{ inputs.source_ref }}
                  PLAN_WARNING_MINUTES: ${{ inputs.warning_minutes }}
                  PLAN_FORCE: ${{ inputs.force }}
                  PLAN_OUTPUT: ${{ runner.temp }}/plan.json
              run: python deploy/carbon-deploy.py plan

            - name: Replace an older plan for this server
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  PLAN_TARGET: ${{ inputs.target }}
              run: python3 deploy/carbon-deploy.py cancel "$PLAN_TARGET"

            - name: Save deployment plan
              uses: actions/upload-artifact@v4
              with:
                  name: carbon-deploy-${{ inputs.target }}
                  path: ${{ runner.temp }}/plan.json
                  retention-days: 2
                  if-no-files-found: error

    claim:
        if: github.event_name == 'repository_dispatch'
        runs-on: ubuntu-24.04
        permissions:
            actions: write
            contents: read
        outputs:
            claimed: ${{ steps.claim.outputs.claimed }}
            target: ${{ steps.claim.outputs.target }}
            version: ${{ steps.claim.outputs.version }}
            source_ref: ${{ steps.claim.outputs.source_ref }}
            warning_minutes: ${{ steps.claim.outputs.warning_minutes }}
            force: ${{ steps.claim.outputs.force }}
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Claim authorised deployment plan
              id: claim
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  PLAN_ARTIFACT_ID: ${{ github.event.client_payload.artifact_id }}
                  PLAN_TARGET: ${{ github.event.client_payload.target }}
              run: python3 deploy/carbon-deploy.py claim "$PLAN_ARTIFACT_ID" "$PLAN_TARGET"

    schedule:
        if: github.event_name == 'schedule'
        runs-on: ubuntu-24.04
        permissions:
            actions: read
            contents: write
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - name: Start due deployments
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: python3 deploy/carbon-deploy.py dispatch

    deploy:
        needs: claim
        if: >-
            always() &&
            ((github.event_name == 'workflow_run' &&
              github.event.workflow_run.conclusion == 'success' &&
              github.event.workflow_run.event == 'push') ||
             (github.event_name == 'workflow_dispatch' && !inputs.carbon_aware &&
              (inputs.target == 'dev' ||
               (github.actor == 'FreddyMSchubert' && github.triggering_actor == 'FreddyMSchubert'))) ||
             (github.event_name == 'repository_dispatch' &&
              needs.claim.result == 'success' && needs.claim.outputs.claimed == 'true'))
        runs-on: ubuntu-24.04
        environment: ${{ github.event_name == 'repository_dispatch' && needs.claim.outputs.target || github.event_name == 'workflow_run' && 'dev' || inputs.target }}
        permissions:
            actions: write
            contents: read
            packages: read
        env:
            DEPLOY_TARGET: ${{ github.event_name == 'repository_dispatch' && needs.claim.outputs.target || github.event_name == 'workflow_run' && 'dev' || inputs.target }}
            DEPLOY_VERSION: ${{ github.event_name == 'repository_dispatch' && needs.claim.outputs.version || github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.version }}
            WARNING_MINUTES: ${{ github.event_name == 'repository_dispatch' && needs.claim.outputs.warning_minutes || github.event_name == 'workflow_run' && '0' || inputs.warning_minutes }}
            FORCE_DEPLOY: ${{ github.event_name == 'repository_dispatch' && needs.claim.outputs.force || github.event_name == 'workflow_run' && 'false' || inputs.force }}
        steps:
            - name: Checkout scheduler for immediate deploys
              if: github.event_name != 'repository_dispatch'
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  persist-credentials: false

            - name: Validate requested version
              id: version
              shell: bash
              env:
                  REQUESTED_VERSION: ${{ env.DEPLOY_VERSION }}
                  REQUESTED_SOURCE_REF: ${{ github.event_name == 'repository_dispatch' && needs.claim.outputs.source_ref || inputs.source_ref }}
              run: |
                  tag="$REQUESTED_VERSION"
                  ref="${REQUESTED_SOURCE_REF:-$REQUESTED_VERSION}"
                  if [[ "${tag,,}" == dev ]]; then
                    if [[ "$DEPLOY_TARGET" != dev ]]; then
                      echo "Production requires a release tag, not dev" >&2
                      exit 1
                    fi
                    tag=dev
                    ref=''
                  elif [[ "$tag" =~ ^[0-9a-fA-F]{40}$ ]]; then
                    tag="${tag,,}"
                    ref="$tag"
                  fi
                  if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
                    echo "'$tag' is not a valid image tag" >&2
                    exit 1
                  fi
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "ref=$ref" >> "$GITHUB_OUTPUT"
                  echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Verify all requested images exist
              id: images
              env:
                  IMAGE_PREFIX: ${{ steps.version.outputs.prefix }}
                  REQUESTED_TAG: ${{ steps.version.outputs.tag }}
                  REQUESTED_REF: ${{ steps.version.outputs.ref }}
              run: |
                  tag="$REQUESTED_TAG"
                  ref="$REQUESTED_REF"
                  if [[ "$tag" == dev ]]; then
                    manifest=$(docker buildx imagetools inspect --raw "${IMAGE_PREFIX}-api:dev")
                    ref=$(jq -r '.annotations["org.opencontainers.image.revision"] // empty' <<< "$manifest")
                    if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
                      echo 'The dev image does not identify a complete built commit; run checks-tests-images first' >&2
                      exit 1
                    fi
                    tag="$ref"
                  fi
                  {
                    echo '### Deployment selection'
                    echo "- Target: $DEPLOY_TARGET"
                    echo "- Requested version: $DEPLOY_VERSION"
                    echo "- Resolved image tag: $tag"
                    echo "- Deployment files ref: $ref"
                    echo "- Warning minutes: $WARNING_MINUTES"
                    echo "- Force: $FORCE_DEPLOY"
                  } >> "$GITHUB_STEP_SUMMARY"
                  for service in api web mc velocity waiting-room backup; do
                    image="${IMAGE_PREFIX}-${service}:${tag}"
                    echo "Checking $image"
                    if ! docker manifest inspect "$image" >/dev/null; then
                      echo "::error::Required image is unavailable: $image"
                      exit 1
                    fi
                  done
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "ref=$ref" >> "$GITHUB_OUTPUT"

            - name: Cancel pending plan for this server
              if: github.event_name != 'repository_dispatch'
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: python3 deploy/carbon-deploy.py cancel "$DEPLOY_TARGET"

            - name: Checkout deployment files
              uses: actions/checkout@v6
              with:
                  ref: ${{ steps.images.outputs.ref }}
                  persist-credentials: false

            - name: Configure SSH
              env:
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
              run: |
                  test -n "$DEPLOY_SSH_KEY"
                  test -n "$DEPLOY_KNOWN_HOSTS"
                  install -d -m 700 ~/.ssh
                  printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
                  printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

            - name: Verify SSH configuration
              shell: bash
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
              run: |
                  test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST variable is empty" >&2; exit 1; }
                  [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "DEPLOY_PORT variable is invalid" >&2; exit 1; }
                  ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null || {
                    echo "DEPLOY_SSH_KEY is not a valid OpenSSH private key" >&2
                    exit 1
                  }
                  ssh-keygen -lf ~/.ssh/known_hosts >/dev/null || {
                    echo "DEPLOY_KNOWN_HOSTS is not a valid known_hosts entry" >&2
                    exit 1
                  }

                  known_host="$DEPLOY_HOST"
                  [[ "$DEPLOY_PORT" == 22 ]] || known_host="[$DEPLOY_HOST]:$DEPLOY_PORT"
                  ssh-keygen -F "$known_host" -f ~/.ssh/known_hosts >/dev/null || {
                    echo "DEPLOY_KNOWN_HOSTS has no entry for the configured host and port" >&2
                    exit 1
                  }

                  ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" true || {
                    echo "SSH files are valid and the target entry exists, but strict connection failed; the OpenSSH error above distinguishes a changed host key from rejected client authentication" >&2
                    exit 1
                  }

            - name: Copy deployment files and deploy
              shell: bash
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
                  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/mmucraft' }}
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GHCR_USER: ${{ github.actor }}
                  IMAGE_PREFIX: ${{ steps.version.outputs.prefix }}
                  IMAGE_TAG: ${{ steps.images.outputs.tag }}
              run: |
                  test -n "$DEPLOY_HOST"
                  test -n "$DEPLOY_USER"
                  [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
                  [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
                  [[ "$DEPLOY_PATH" != / && "$DEPLOY_PATH" != *..* ]]

                  ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
                    "set -eu; mkdir -p '$DEPLOY_PATH'; df -h '$DEPLOY_PATH'; df -i '$DEPLOY_PATH'; ls -ld '$DEPLOY_PATH'; if [ '$DEPLOY_TARGET' = dev ]; then docker image prune -a -f --filter until=168h >/dev/null; docker builder prune -f >/dev/null; df -h '$DEPLOY_PATH'; df -i '$DEPLOY_PATH'; fi; test -w '$DEPLOY_PATH'"
                  tar -czf - -C deploy . -C .. monitoring .env.example | \
                    ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o ServerAliveInterval=30 -o ServerAliveCountMax=3 "$DEPLOY_USER@$DEPLOY_HOST" \
                      "tar -xzf - -C '$DEPLOY_PATH' && chmod 700 '$DEPLOY_PATH/deploy.sh'"

                  printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io --username '$GHCR_USER' --password-stdin"
                  status=0
                  ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o ServerAliveInterval=30 -o ServerAliveCountMax=3 "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && ./deploy.sh '$IMAGE_TAG' '$IMAGE_PREFIX' '$WARNING_MINUTES' '$FORCE_DEPLOY' '$DEPLOY_TARGET'" || status=$?
                  ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "docker logout ghcr.io" || true
                  exit "$status"
