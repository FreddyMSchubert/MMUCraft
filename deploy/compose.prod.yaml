services:
    api:
        environment:
            NODE_OPTIONS: --max-old-space-size=384
        mem_limit: 640m
        mem_reservation: 256m
        memswap_limit: 640m
        deploy:
            resources:
                limits:
                    memory: 640m
                reservations:
                    memory: 256m

    web:
        environment:
            NODE_OPTIONS: --max-old-space-size=256
        mem_limit: 512m
        mem_reservation: 128m
        memswap_limit: 512m
        deploy:
            resources:
                limits:
                    memory: 512m
                reservations:
                    memory: 128m

    minecraft:
        environment:
            MEMORY: 8G
            INIT_MEMORY: 2G
        mem_limit: 9g
        mem_reservation: 6g
        memswap_limit: 9g
        deploy:
            resources:
                limits:
                    memory: 9g
                reservations:
                    memory: 6g

    surprising-saturday:
        environment:
            MEMORY: 3G
            INIT_MEMORY: 1G
        mem_limit: 4g
        mem_reservation: 1g
        memswap_limit: 4g

    event-controller:
        mem_limit: 96m
        mem_reservation: 24m
        memswap_limit: 96m

    backup:
        image: ${IMAGE_PREFIX:?deploy.sh must set IMAGE_PREFIX}-backup:${IMAGE_TAG:?deploy.sh must set IMAGE_TAG}
        user: ${PUID:-1000}:${PGID:-1000}
        read_only: true
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        environment:
            TZ: Europe/London
            API_BASE_URL: http://api:8080
            INTERNAL_API_SECRET: ${VELOCITY_API_SECRET:?set VELOCITY_API_SECRET in .env}
            RESTIC_REPOSITORY: /backups/restic
            RESTIC_PASSWORD: ${BACKUP_RESTIC_PASSWORD:?set BACKUP_RESTIC_PASSWORD in .env}
            RESTIC_HOST: mmucraft-production
            RESTIC_CACHE_DIR: /tmp/restic-cache
        volumes:
            - ./data:/source/data:ro
            - ./.env:/source/config/.env:ro
            - ./data/locks:/locks
            - ./backups:/backups
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=256m,mode=1777
        expose:
            - '8080'
        depends_on:
            api:
                condition: service_healthy
            minecraft:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:8080/metrics.txt']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 1m
        mem_limit: 512m
        mem_reservation: 32m
        memswap_limit: 512m
        pids_limit: 128
        deploy:
            resources:
                limits:
                    memory: 512m
                    pids: 128
                reservations:
                    memory: 32m
        restart: unless-stopped
        stop_grace_period: 1m
        logging:
            driver: local
            options:
                max-size: 10m
                max-file: '3'
        networks: [app]

    velocity:
        environment:
            MEMORY: 256M
        mem_limit: 512m
        mem_reservation: 128m
        memswap_limit: 512m
        deploy:
            resources:
                limits:
                    memory: 512m
                reservations:
                    memory: 128m

    prometheus:
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=1y
            - --log.level=warn
        depends_on:
            backup:
                condition: service_healthy
        mem_limit: 512m
        mem_reservation: 128m
        memswap_limit: 512m

    grafana:
        mem_limit: 512m
        mem_reservation: 128m
        memswap_limit: 512m

    loki:
        environment:
            LOKI_RETENTION_PERIOD: 336h
        mem_limit: 512m
        mem_reservation: 128m
        memswap_limit: 512m

    alloy:
        mem_limit: 256m
        mem_reservation: 64m
        memswap_limit: 256m

    cadvisor:
        mem_limit: 128m
        mem_reservation: 32m
        memswap_limit: 128m

    node-exporter:
        mem_limit: 64m
        mem_reservation: 16m
        memswap_limit: 64m
