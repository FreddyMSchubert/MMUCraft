apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-data
  namespace: mc-stack-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: mc-stack-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      containers:
        - name: minecraft
          image: mcstack/minecraft-server
          imagePullPolicy: IfNotPresent
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: FABRIC
            - name: VERSION
              value: "1.21.11"
            - name: MODRINTH_PROJECTS
              value: fabric-api
            - name: ONLINE_MODE
              value: "FALSE"
            - name: MEMORY
              value: 2G
            - name: INIT_MEMORY
              value: 1G
            - name: VIEW_DISTANCE
              value: "8"
            - name: SIMULATION_DISTANCE
              value: "8"
            - name: MOTD
              value: "Tilt + k3d Fabric auth starter"
            - name: AUTH_RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
          ports:
            - containerPort: 25565
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: mc-stack-dev
spec:
  selector:
    app: minecraft
  ports:
    - port: 25565
      targetPort: 25565
