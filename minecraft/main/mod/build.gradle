    group = 'verification'
    description = 'Check the glider item, recipe, repairs, enchantments, speed, and heat sources.'
    classpath = sourceSets.trailCheck.runtimeClasspath
    mainClass = 'uk.co.httpsmmuminecraftsociety.mainmod.fakeItems.charms.glider.GliderCheck'
    enableAssertions = true
    args projectDir.absolutePath
    workingDir = layout.buildDirectory.dir('gliderCheck').get().asFile
    doFirst { workingDir.mkdirs() }
}

tasks.register('checkSlimeDetector', JavaExec) {
