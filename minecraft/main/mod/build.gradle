import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'com.google.protobuf' version '0.9.5'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "mainmod" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    accessWidenerPath = file("src/main/resources/mainmod.accesswidener")
}

def grpcVersion = '1.69.1'
def protobufVersion = '3.25.5'
def prometheusVersion = '1.8.0'

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation include("com.google.protobuf:protobuf-java:${protobufVersion}")
    implementation include("io.grpc:grpc-api:${grpcVersion}")
    implementation include("io.grpc:grpc-core:${grpcVersion}")
    implementation include("io.grpc:grpc-context:${grpcVersion}")
    implementation include("io.grpc:grpc-netty-shaded:${grpcVersion}")
    implementation include("io.grpc:grpc-protobuf:${grpcVersion}")
    implementation include("io.grpc:grpc-stub:${grpcVersion}")
    implementation include("io.grpc:grpc-protobuf-lite:${grpcVersion}")
    implementation include("io.perfmark:perfmark-api:0.27.0")

    implementation include("io.prometheus:prometheus-metrics-core:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-model:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-config:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-tracer-initializer:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-tracer-common:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-tracer-otel:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-tracer-otel-agent:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-exporter-httpserver:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-exporter-common:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-exposition-textformats:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-exposition-formats:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-instrumentation-jvm:${prometheusVersion}")

    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }

    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }

    generateProtoTasks {
        ofSourceSet('main').configureEach {
            plugins {
                grpc {}
            }
        }
    }
}

sourceSets {
    main {
        proto {
            srcDirs = [file('../../../proto')]
        }
    }
}

processResources {
    dependsOn "generateMiniBlockRecipes"
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

def miniBlockCatalog = file("src/main/resources/data/mainmod/miniblocks.json")
def generatedMiniBlockResources = layout.buildDirectory.dir("generated/miniblockResources")

tasks.register("generateMiniBlockRecipes") {
    inputs.file(miniBlockCatalog)
    outputs.dir(generatedMiniBlockResources)

    doLast {
        File resourceRoot = generatedMiniBlockResources.get().asFile
        File recipeDirectory = new File(resourceRoot, "data/mainmod/recipe/miniblocks")
        delete(recipeDirectory)
        recipeDirectory.mkdirs()

        List<Map<String, String>> definitions = new JsonSlurper().parse(miniBlockCatalog) as List<Map<String, String>>
        Set<String> ids = new HashSet<>()

        definitions.each { definition ->
            for (String field : ["id", "input", "name", "texture"]) {
                if (!(definition[field] instanceof String) || definition[field].isBlank()) {
                    throw new GradleException("Mini block definition is missing string field '${field}'")
                }
            }
            if (!ids.add(definition.id)) {
                throw new GradleException("Duplicate mini block id: ${definition.id}")
            }

            Map<String, Object> recipe = [
                    type      : "minecraft:stonecutting",
                    ingredient: definition.input,
                    result    : [
                            id        : "minecraft:player_head",
                            count     : 8,
                            components: [
                                    "minecraft:profile"  : [
                                            properties: [[name: "textures", value: definition.texture]]
                                    ],
                                    "minecraft:item_name": definition.name,
                                    "minecraft:rarity"   : "common"
                            ]
                    ]
            ]

            File recipeFile = new File(recipeDirectory, "${definition.id}.json")
            recipeFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(recipe)) + System.lineSeparator()
        }
    }
}

sourceSets.main.resources.srcDir(generatedMiniBlockResources)

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a SourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

fabricApi {
    configureDataGeneration() {
        client = true
    }
}

tasks.named("sourcesJar") {
    dependsOn tasks.named("runDatagen")
}

tasks.named("build") {
    dependsOn tasks.named("runDatagen")
}
