                ["food/beer_again", "Hair of the Dog", "Drink beer while already under its effects.", "fake:beer", "food/beer", "goal"]
        ]
        advancements.each { writeAdvancement(*it) }

        def chain = { String prefix, List<Integer> values, String title, String description, String icon, String parent ->
            String previous = parent
            values.each { value ->
                String path = "${prefix}_${value}"
                writeAdvancement(path, "${title} ${value}", description.replace("%s", value.toString()), icon, previous,
                        value >= 100 ? "challenge" : value >= 10 ? "goal" : "task")
                previous = path
            }
        }

        chain("charms/get", [1, 3, 5, 10, 15, 20], "Charm Collector", "Hold %s distinct upgradeable charms at once.", "fake:charm-lucky-charm", "root")
        chain("charms/upgrade", [3, 5, 10, 15, 20], "Charm Tinkerer", "Upgrade charms %s times.", "fake:charm-lucky-charm", "charms/upgrade_once")
        chain("cosmetics/unlock", [1, 5, 10, 20, 50, 100], "Wardrobe", "Unlock %s distinct cosmetics in the shop.", "fake:cosmetic-amogus", "root")
        writeAdvancement("cosmetics/unlock_all", "Complete Wardrobe", "Unlock every cosmetic in the shop.", "fake:cosmetic-crown-ornate", "cosmetics/unlock_100", "challenge")
        ["common", "uncommon", "rare", "epic", "legendary", "mythical"].eachWithIndex { rarity, index ->
            String previous = index == 0 ? "cosmetics/unlock_1" : "cosmetics/unlock_${["common", "uncommon", "rare", "epic", "legendary"][index - 1]}"
            writeAdvancement("cosmetics/unlock_${rarity}", "${rarity.capitalize()} Style", "Unlock a ${rarity} cosmetic in the shop.",
                    "fake:${["cosmetic-amogus", "cosmetic-academic-hat", "cosmetic-calico-cat-pet-hat", "cosmetic-posh-squid", "cosmetic-crown-royal", "cosmetic-crown-ornate"][index]}", previous, index >= 4 ? "challenge" : "task")
        }
        chain("cosmetics/buy", [1, 5, 10, 20, 50, 100], "Retail Therapy", "Buy %s cosmetics.", "fake:coin-100", "root")
        chain("knowledge/read", [1, 3, 5, 10, 15, 20], "Well Read", "Read %s knowledge pages.", "fake:charm-knowledge-book", "root")
        chain("social/claim", [1, 3, 5, 7, 10, 12, 15], "Landowner", "Reach %s claimed chunks.", "minecraft:map", "root")
        chain("social/streak", [1, 2, 3, 5, 7, 10, 14, 30, 50, 75, 100, 150, 200, 250, 300, 365], "Login Streak", "Reach a %s-day login streak.", "minecraft:fire_charge", "root")
        chain("social/full_dailies", [1, 3, 7, 10, 14, 30, 50, 75, 100, 150, 200, 250, 300, 365], "Daily Devotion", "Fully complete dailies on %s days.", "minecraft:clock", "root")
        chain("sniffers/bred", [1, 3, 5, 10, 20, 30, 50, 100, 200, 500, 1000, 5000, 10000], "Sniffer Population", "Breed %s sniffers.", "minecraft:sniffer_egg", "root")
        chain("utility/jokes", [1, 3, 5], "Critic", "Review Joke Books: %s completed.", "fake:charm-joke-book", "root")
        [1, 10, 100, 1000, 10000, 100000, 1000000].eachWithIndex { value, index ->
            writeAdvancement("coins/hold_${value}", "${value} Dabloons", "Hold a ${value}-Dabloon coin.", "fake:coin-${value}",
                    index == 0 ? "utility/wallet" : "coins/hold_${[1, 10, 100, 1000, 10000, 100000][index - 1]}", value >= 100000 ? "challenge" : "task")
        }
        chain("money/balance", [100, 1000, 10000, 100000, 1000000], "Liquid Assets", "Hold %s Dabloons at once.", "fake:charm-wallet", "utility/wallet")

        ["leather", "ingot", "magic", "bejeweled", "withered", "endless"].eachWithIndex { tier, index ->
            writeAdvancement("backpacks/${tier}", "${tier.capitalize()} Backpack", "Craft a ${tier} backpack.",
                    "fake:charm-${tier}-backpack", index == 0 ? "root" : "backpacks/${["leather", "ingot", "magic", "bejeweled", "withered"][index - 1]}", index >= 4 ? "goal" : "task")
        }
        (2..6).each { hour ->
            writeAdvancement("social/join_${hour}", "${hour} a.m. Club", "Join between ${hour} a.m. and ${hour + 1} a.m. British time.",
                    "minecraft:clock", hour == 2 ? "social/join_insane_hour" : "social/join_${hour - 1}", "goal")
        }
        ["returning", "displacement", "insomnia", "resonance"].eachWithIndex { potion, index ->
            writeAdvancement("potions/${potion}", "Potion of ${potion.capitalize()}", "Use the Potion of ${potion.capitalize()}.",
                    "fake:charm-potion-${potion}", index == 0 ? "utility/use_potion" : "potions/${["returning", "displacement", "insomnia"][index - 1]}", "task")
        }
        (1..5).each { level ->
            writeAdvancement("fishing/lucky_charm_${level}", "Lucky Charm ${level}", "Upgrade the Lucky Charm to level ${level}.",
                    "fake:charm-lucky-charm", level == 1 ? "fishing/luck_3" : "fishing/lucky_charm_${level - 1}", level == 5 ? "challenge" : "task")
        }
    }
}

tasks.named("processResources") {
    dependsOn tasks.named("generateMasteryAdvancements")
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a SourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

fabricApi {
    configureDataGeneration() {
        client = true
    }
}

tasks.named("sourcesJar") {
    dependsOn tasks.named("runDatagen")
}

tasks.named("build") {
    dependsOn tasks.named("runDatagen")
    dependsOn tasks.named("checkDailyCatalog")
}
