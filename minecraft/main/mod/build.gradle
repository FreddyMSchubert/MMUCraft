    description = 'Check crafting map sizes from 16 through 2048 blocks.'
    classpath = sourceSets.minecraftCheck.runtimeClasspath
    mainClass = 'uk.co.httpsmmuminecraftsociety.mainmod.maps.MapResizeCheck'
    enableAssertions = true
    workingDir = layout.buildDirectory.dir('mapResizeCheck').get().asFile
    doFirst { workingDir.mkdirs() }
}

