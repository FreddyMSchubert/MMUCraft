name: kubecraft

x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

x-node-runtime: &node-runtime
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  logging: *logging
  restart: unless-stopped
  stop_grace_period: 30s

services:
  api:
    <<: *node-runtime
    image: ${IMAGE_PREFIX:?deploy.sh must set IMAGE_PREFIX}-api:${IMAGE_TAG:?deploy.sh must set IMAGE_TAG}
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      API_GRPC_HOST: 0.0.0.0
      API_GRPC_PORT: "50051"
      MOD_GRPC_TARGET: minecraft:50052
      DATABASE_URL: /app/data/app.sqlite
      DATABASE_MIGRATIONS_PATH: /app/drizzle
      AUTH_CODE_SECRET: ${AUTH_CODE_SECRET:?set AUTH_CODE_SECRET in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY in .env}
      RESEND_FROM: ${RESEND_FROM:?set RESEND_FROM in .env}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_AVATAR_BASE_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}/api/discord/avatar
      COOKIE_SECURE: "true"
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      VELOCITY_API_SECRET: ${VELOCITY_API_SECRET:?set VELOCITY_API_SECRET in .env}
      TZ: ${TZ:-Europe/London}
    volumes:
      - ./data/api:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    mem_limit: 800m
    mem_reservation: 384m
    memswap_limit: 800m
    deploy:
      resources:
        limits:
          memory: 800m
          pids: 256
        reservations:
          memory: 384m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      start_interval: 1s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks: [app]

  web:
    <<: *node-runtime
    image: ${IMAGE_PREFIX:?deploy.sh must set IMAGE_PREFIX}-web:${IMAGE_TAG:?deploy.sh must set IMAGE_TAG}
    environment:
      API_BASE_URL: http://api:8080
      SITE_IMAGE_TAG: ${IMAGE_TAG}
      DISCORD_URL: ${DISCORD_URL:-https://discord.gg/pPgZqRS5b2}
      INSTAGRAM_URL: ${INSTAGRAM_URL:-https://www.instagram.com/mmuminecraftsociety/}
      TZ: ${TZ:-Europe/London}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,size=64m,mode=1777
    mem_limit: 800m
    mem_reservation: 256m
    memswap_limit: 800m
    deploy:
      resources:
        limits:
          memory: 800m
          pids: 256
        reservations:
          memory: 256m
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      start_interval: 1s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks: [app]

  minecraft:
    image: ${IMAGE_PREFIX:?deploy.sh must set IMAGE_PREFIX}-mc:${IMAGE_TAG:?deploy.sh must set IMAGE_TAG}
    init: true
    stdin_open: true
    tty: true
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "26.2"
      FABRIC_LOADER_VERSION: "0.19.3"
      MODRINTH_PROJECTS: |-
        fabric-api
        lithium?
        ferrite-core?
        krypton?
        c2me-fabric?
        scalablelux?
        servercore?
        zfastnoise?
        fabricproxy-lite:2.12.0
      MODRINTH_DOWNLOAD_DEPENDENCIES: required
      MEMORY: 1536M
      INIT_MEMORY: 1G
      STOP_DURATION: "110"
      USE_MEOWICE_FLAGS: "true"
      ENABLE_ROLLING_LOGS: "false"
      LOG_TIMESTAMP: "true"
      CREATE_CONSOLE_IN_PIPE: "true"
      OVERRIDE_SERVER_PROPERTIES: "false"
      SKIP_SERVER_PROPERTIES: "true"
      UID: ${PUID:-1000}
      GID: ${PGID:-1000}
      TZ: ${TZ:-Europe/London}
      MOD_GRPC_HOST: 0.0.0.0
      MOD_GRPC_PORT: "50052"
      API_GRPC_TARGET: api:50051
      FABRIC_PROXY_SECRET: ${VELOCITY_FORWARDING_SECRET:?set VELOCITY_FORWARDING_SECRET in .env}
    volumes:
      - ./data/minecraft:/data
    mem_limit: 2g
    mem_reservation: 1g
    memswap_limit: 2g
    pids_limit: 512
    deploy:
      resources:
        limits:
          memory: 2g
          pids: 512
        reservations:
          memory: 1g
    depends_on:
      api:
        condition: service_healthy
        restart: true
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 10s
      start_interval: 1s
      timeout: 5s
      retries: 12
      start_period: 2m
    networks: [app]

  velocity:
    image: ${IMAGE_PREFIX:?deploy.sh must set IMAGE_PREFIX}-velocity:${IMAGE_TAG:?deploy.sh must set IMAGE_TAG}
    init: true
    environment:
      CFG_VELOCITY_FORWARDING_SECRET: ${VELOCITY_FORWARDING_SECRET:?set VELOCITY_FORWARDING_SECRET in .env}
      VELOCITY_API_SECRET: ${VELOCITY_API_SECRET:?set VELOCITY_API_SECRET in .env}
      MMU_API_BASE_URL: http://api:8080
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/London}
    ports:
      - "${MINECRAFT_BIND:-0.0.0.0}:${MINECRAFT_PORT:-25565}:25565/tcp"
    volumes:
      - ./data/velocity:/server
    mem_limit: 768m
    mem_reservation: 256m
    memswap_limit: 768m
    pids_limit: 256
    deploy:
      resources:
        limits:
          memory: 768m
          pids: 256
        reservations:
          memory: 256m
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: unless-stopped
    networks: [app]

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
      - --log.level=warn
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${MONITORING_CONFIG_PATH:-../monitoring}/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    mem_limit: 512m
    mem_reservation: 128m
    memswap_limit: 512m
    depends_on:
      minecraft:
        condition: service_started
      cadvisor:
        condition: service_started
      node-exporter:
        condition: service_started
    logging: *logging
    restart: unless-stopped
    networks: [app]

  grafana:
    image: grafana/grafana:13.1.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_LOG_LEVEL: warn
      GF_SERVER_ROOT_URL: https://grafana.${PUBLIC_HOST:?deploy.sh must set PUBLIC_HOST}/
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/gameplay.json
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - grafana-data:/var/lib/grafana
      - ${MONITORING_CONFIG_PATH:-../monitoring}/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ${MONITORING_CONFIG_PATH:-../monitoring}/grafana/provisioning/dashboards/private.yml:/etc/grafana/provisioning/dashboards/main.yml:ro
      - ${MONITORING_CONFIG_PATH:-../monitoring}/grafana/dashboards/admin:/etc/grafana/dashboards:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    mem_limit: 384m
    mem_reservation: 128m
    memswap_limit: 384m
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    logging: *logging
    restart: unless-stopped
    networks: [app]

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.2
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    mem_limit: 256m
    mem_reservation: 64m
    memswap_limit: 256m
    logging: *logging
    restart: unless-stopped
    networks: [app]

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      - --log.level=warn
    pid: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /:/host:ro,rslave
    mem_limit: 128m
    mem_reservation: 32m
    memswap_limit: 128m
    logging: *logging
    restart: unless-stopped
    networks: [app]

  loki:
    image: grafana/loki:3.7.6
    command: -config.file=/etc/loki/loki.yml
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${MONITORING_CONFIG_PATH:-../monitoring}/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    mem_limit: 512m
    mem_reservation: 128m
    memswap_limit: 512m
    logging: *logging
    restart: unless-stopped
    networks: [app]

  alloy:
    image: grafana/alloy:v1.18.0
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    volumes:
      - ${MONITORING_CONFIG_PATH:-../monitoring}/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    mem_limit: 256m
    mem_reservation: 64m
    memswap_limit: 256m
    depends_on:
      loki:
        condition: service_started
    logging: *logging
    restart: unless-stopped
    networks: [app]

  nginx:
    image: nginx:stable-alpine
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    pids_limit: 64
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?deploy.sh must set PUBLIC_HOST}
      NGINX_ENVSUBST_FILTER: ^PUBLIC_HOST$
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt/live/mmucraft:/etc/letsencrypt/live/mmucraft:ro
      - /etc/letsencrypt/archive/mmucraft:/etc/letsencrypt/archive/mmucraft:ro
    tmpfs:
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m,mode=755
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,mode=1777
      - /var/run:rw,noexec,nosuid,size=1m,mode=1777
    mem_limit: 64m
    mem_reservation: 16m
    memswap_limit: 64m
    deploy:
      resources:
        limits:
          memory: 64m
          pids: 64
        reservations:
          memory: 16m
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      grafana:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *logging
    restart: unless-stopped
    networks: [app]

networks:
  app:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
