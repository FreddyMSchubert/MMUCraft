# The 4 GiB dev host needs swap before these shared-memory settings are deployed.
# Heap sizes and soft reservations remain; there are no per-container hard memory caps.
services:
    api:
        environment:
            NODE_OPTIONS: --max-old-space-size=192
        mem_reservation: 128m
        deploy:
            resources:
                reservations:
                    memory: 128m

    web:
        environment:
            NODE_OPTIONS: --max-old-space-size=192
        mem_reservation: 128m
        deploy:
            resources:
                reservations:
                    memory: 128m

    minecraft:
        environment:
            MEMORY: 1G
            INIT_MEMORY: 256M
        mem_reservation: 1g
        deploy:
            resources:
                reservations:
                    memory: 1g

    waiting-room:
        environment:
            MEMORY: 384M
            INIT_MEMORY: 64M
            JVM_XX_OPTS: -XX:ActiveProcessorCount=1
        cpus: '0.5'
        mem_reservation: 512m

    surprising-saturday:
        environment:
            MEMORY: 1G
            INIT_MEMORY: 256M
        mem_reservation: 256m

    event-controller:
        mem_reservation: 24m

    velocity:
        environment:
            MEMORY: 192M
        mem_reservation: 96m
        deploy:
            resources:
                reservations:
                    memory: 96m

    prometheus:
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=1d
            - --log.level=warn
        mem_reservation: 48m

    grafana:
        mem_reservation: 64m

    loki:
        environment:
            LOKI_RETENTION_PERIOD: 24h
        mem_reservation: 64m

    alloy:
        mem_reservation: 24m

    cadvisor:
        mem_reservation: 24m

    node-exporter:
        mem_reservation: 16m

    nginx:
        mem_limit: !reset null
        memswap_limit: !reset null
        deploy:
            resources:
                limits:
                    memory: !reset null
