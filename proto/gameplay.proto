syntax = "proto3";

package mcstack.gameplay.v1;

option java_multiple_files = true;
option java_package = "uk.co.httpsmmuminecraftsociety.mainmod.grpc";
option java_outer_classname = "GameplayProto";

service GameplayEvents {
  rpc UnlockNextKnowledge(UnlockNextKnowledgeRequest) returns (UnlockNextKnowledgeResponse);
  rpc GetUnlockAvailability(GetUnlockAvailabilityRequest) returns (GetUnlockAvailabilityResponse);
  rpc SyncPlayerStats(SyncPlayerStatsRequest) returns (SyncPlayerStatsResponse);
  rpc RecordMoneyEvent(RecordMoneyEventRequest) returns (RecordMoneyEventResponse);
  rpc RecordFishCatch(RecordFishCatchRequest) returns (RecordFishCatchResponse);
  rpc GetClaimsSnapshot(GetClaimsSnapshotRequest) returns (ClaimsSnapshot);
  rpc GetFeatureToggles(GetFeatureTogglesRequest) returns (FeatureTogglesSnapshot);
  rpc GetDailyTasksSnapshot(GetDailyTasksSnapshotRequest) returns (DailyTasksSnapshot);
  rpc UpdateDailyTask(UpdateDailyTaskRequest) returns (UpdateDailyTaskResponse);
  rpc PublishDiscordEvent(PublishDiscordEventRequest) returns (PublishDiscordEventResponse);
}

service GameplayControl {
  rpc GetOnlinePlayers(GetOnlinePlayersRequest) returns (GetOnlinePlayersResponse);
  rpc GrantDailyLoginBonus(GrantDailyLoginBonusRequest) returns (GrantDailyLoginBonusResponse);
  rpc GrantGiftCodeMoney(GrantGiftCodeMoneyRequest) returns (GrantGiftCodeMoneyResponse);
  rpc GrantKnowledgeReadMoney(GrantKnowledgeReadMoneyRequest) returns (GrantKnowledgeReadMoneyResponse);
  rpc GenerateDailyTasks(GenerateDailyTasksRequest) returns (GenerateDailyTasksResponse);
  rpc ClaimDailyTask(ClaimDailyTaskRequest) returns (ClaimDailyTaskResponse);
  rpc PickDailyAdvancement(PickDailyAdvancementRequest) returns (PickDailyAdvancementResponse);
  rpc ClaimDailyAdvancement(ClaimDailyAdvancementRequest) returns (ClaimDailyAdvancementResponse);
  rpc PurchaseShopItem(PurchaseShopItemRequest) returns (PurchaseShopItemResponse);
  rpc PurchaseExternalPlayerInvite(PurchaseExternalPlayerInviteRequest) returns (PurchaseExternalPlayerInviteResponse);
  rpc GetCurrentClaimChunk(GetCurrentClaimChunkRequest) returns (GetCurrentClaimChunkResponse);
  rpc PurchaseClaim(PurchaseClaimRequest) returns (PurchaseClaimResponse);
  rpc ApplyClaimsSnapshot(ClaimsSnapshot) returns (ApplyClaimsSnapshotResponse);
  rpc ApplyFeatureToggles(FeatureTogglesSnapshot) returns (ApplyFeatureTogglesResponse);
  rpc ApplyPlayerColor(ApplyPlayerColorRequest) returns (ApplyPlayerColorResponse);
  rpc ApplyPlayerSettings(ApplyPlayerSettingsRequest) returns (ApplyPlayerSettingsResponse);
  rpc GetCharmInventory(GetCharmInventoryRequest) returns (GetCharmInventoryResponse);
  rpc UpgradeCharm(UpgradeCharmRequest) returns (UpgradeCharmResponse);
  rpc BroadcastDiscordMessage(BroadcastDiscordMessageRequest) returns (BroadcastDiscordMessageResponse);
  rpc RunServerCommand(RunServerCommandRequest) returns (RunServerCommandResponse);
}

message GetOnlinePlayersRequest {}

message OnlinePlayer {
  string minecraft_username = 1;
  string minecraft_uuid = 2;
}

message GetOnlinePlayersResponse {
  repeated OnlinePlayer players = 1;
}

message PublishDiscordEventRequest {
  string type = 1;
  string minecraft_username = 2;
  string minecraft_uuid = 3;
  string content = 4;
  string role = 5;
  string nickname = 6;
  string pronouns = 7;
  string color_hex = 8;
}

message PublishDiscordEventResponse {
  bool accepted = 1;
}

message BroadcastDiscordMessageRequest {
  string discord_name = 1;
  string content = 2;
}

message BroadcastDiscordMessageResponse {
  bool broadcast = 1;
}

message RunServerCommandRequest {
  string command = 1;
  string discord_user = 2;
}

message RunServerCommandResponse {
  bool succeeded = 1;
  int32 result = 2;
  string output = 3;
}

message GetCharmInventoryRequest {
  string minecraft_username = 1;
}

message CharmUpgradeIngredient {
  string raw = 1;
  string display_name = 2;
  string icon_item_id = 3;
  int32 required_count = 4;
  int32 inventory_count = 5;
}

message InventoryCharm {
  string item_id = 2;
  string title = 3;
  int32 current_level = 4;
  int32 max_level = 5;
  int32 target_level = 6;
  int32 price_dabloons = 7;
  string current_ability = 8;
  string next_ability = 9;
  repeated CharmUpgradeIngredient ingredients = 10;
}

message GetCharmInventoryResponse {
  bool online = 1;
  int32 balance_dabloons = 2;
  repeated InventoryCharm charms = 3;
  string message = 4;
}

message UpgradeCharmRequest {
  string minecraft_username = 1;
  string item_id = 2;
  int32 expected_level = 3;
}

message UpgradeCharmResponse {
  bool upgraded = 1;
  bool online = 2;
  int32 balance_dabloons = 3;
  int32 new_level = 4;
  string message = 5;
}

message GetClaimsSnapshotRequest {}

message ClaimData {
  string id = 1;
  string dimension = 2;
  sint32 chunk_x = 3;
  sint32 chunk_z = 4;
  string owner_uuid = 5;
  string owner_name = 6;
  repeated string member_uuids = 7;
  string name = 8;
  string color_hex = 9;
  string owner_color_hex = 10;
  bool has_custom_color = 11;
  bool is_server_claim = 12;
}

message ClaimsSnapshot {
  repeated ClaimData claims = 1;
}

message GetCurrentClaimChunkRequest {
  string minecraft_username = 1;
}

message GetCurrentClaimChunkResponse {
  bool online = 1;
  string dimension = 2;
  sint32 chunk_x = 3;
  sint32 chunk_z = 4;
  int32 balance_dabloons = 5;
  string message = 6;
}

message PurchaseClaimRequest {
  string minecraft_username = 1;
  string dimension = 2;
  sint32 chunk_x = 3;
  sint32 chunk_z = 4;
  int32 price_dabloons = 5;
}

message PurchaseClaimResponse {
  bool purchased = 1;
  bool online = 2;
  int32 balance_dabloons = 3;
  string message = 4;
}

message ApplyClaimsSnapshotResponse {
  bool applied = 1;
}

message GetFeatureTogglesRequest {}

message FeatureToggle {
  string key = 1;
  bool enabled = 2;
}

message FeatureTogglesSnapshot {
  repeated FeatureToggle toggles = 1;
}

message ApplyFeatureTogglesResponse {
  bool applied = 1;
}

message ApplyPlayerColorRequest {
  string minecraft_uuid = 1;
  string color_hex = 2;
}

message ApplyPlayerColorResponse {
  bool applied = 1;
}

message ApplyPlayerSettingsRequest {
  string minecraft_uuid = 1;
  bool show_death_counter = 2;
}

message ApplyPlayerSettingsResponse {
  bool applied = 1;
}

message GrantGiftCodeMoneyRequest {
  string minecraft_username = 1;
  int32 amount_dabloons = 2;
  string code = 3;
  int64 unix_ms = 4;
}

message GrantGiftCodeMoneyResponse {
  bool granted = 1;
  bool online = 2;
  int32 balance_dabloons = 3;
  string message = 4;
}

message GrantKnowledgeReadMoneyRequest {
  string minecraft_username = 1;
  int32 amount_dabloons = 2;
  string message = 3;
}

message GrantKnowledgeReadMoneyResponse {
  bool granted = 1;
  int32 balance_dabloons = 2;
  string message = 3;
}

message UnlockNextKnowledgeRequest {
  string minecraft_username = 1;
  string source_item_id = 2;
  int64 unix_ms = 3;
  string unlock_type = 4;
  string minecraft_uuid = 5;
}

message UnlockNextKnowledgeResponse {
  bool unlocked = 1;
  bool all_unlocked = 2;
  string knowledge_id = 3;
  int32 priority = 4;
  string topic = 5;
  string message = 6;
  string unlock_type = 7;
  string unlocked_id = 8;
  bool has_knowledge_to_unlock = 9;
  bool has_charms_to_unlock = 10;
  bool has_cosmetics_to_unlock = 11;
}

message GetUnlockAvailabilityRequest {
  string minecraft_username = 1;
  int64 unix_ms = 2;
  string minecraft_uuid = 3;
}

message GetUnlockAvailabilityResponse {
  bool account_linked = 1;
  bool has_knowledge_to_unlock = 2;
  bool has_charms_to_unlock = 3;
  bool has_cosmetics_to_unlock = 4;
  string message = 5;
}

message MinecraftStatEntry {
  string key = 1;
  string category = 2;
  string id = 3;
  string label = 4;
  int64 value = 5;
}

message SyncPlayerStatsRequest {
  string minecraft_username = 1;
  int64 unix_ms = 2;
  int32 balance_dabloons = 3;
  repeated MinecraftStatEntry stats = 4;
  string minecraft_uuid = 5;
}

message SyncPlayerStatsResponse {
  bool accepted = 1;
  bool account_linked = 2;
  string message = 3;
  bool is_member = 4;
  bool is_committee = 5;
  string nickname = 6;
  string pronouns = 7;
  bool is_external = 8;
  string color_hex = 9;
  optional bool show_death_counter = 10;
}

message RecordMoneyEventRequest {
  reserved 3;
  string minecraft_username = 1;
  int32 amount_dabloons = 2;
  string source = 4;
  string reference_id = 5;
  int64 unix_ms = 6;
  int32 balance_dabloons = 7;
  string minecraft_uuid = 8;
}

message RecordMoneyEventResponse {
  bool recorded = 1;
  bool duplicate = 2;
  bool account_linked = 3;
  string message = 4;
}

message RecordFishCatchRequest {
  string minecraft_username = 1;
  string minecraft_uuid = 2;
  string fish_id = 3;
  double length_cm = 4;
  string rarity = 5;
  int64 unix_ms = 6;
}

message RecordFishCatchResponse {
  bool recorded = 1;
  bool account_linked = 2;
  bool first_catch = 3;
  bool personal_size_record = 4;
  bool server_size_record = 5;
  bool server_smallest_record = 6;
  string message = 7;
  bool personal_smallest_record = 8;
  bool announce = 9;
  bool first_server_catch_announcement = 10;
}

message GrantDailyLoginBonusRequest {
  string minecraft_username = 1;
  int32 amount = 2;
  string period_key = 3;
  int64 unix_ms = 4;
  string source = 5;
}

message GrantDailyLoginBonusResponse {
  bool granted = 1;
  bool online = 2;
  string message = 3;
}

message DailyTaskState {
  int32 user_id = 1;
  string minecraft_username = 2;
  string period_key = 3;
  string task_json = 4;
  bool claimed = 5;
}

message GetDailyTasksSnapshotRequest {}

message DailyTasksSnapshot {
  repeated DailyTaskState tasks = 1;
}

message UpdateDailyTaskRequest {
  int32 user_id = 1;
  string period_key = 2;
  string task_json = 3;
  int64 unix_ms = 4;
}

message UpdateDailyTaskResponse {
  bool accepted = 1;
  string message = 2;
}

message GenerateDailyTasksRequest {
  int32 user_id = 1;
  string minecraft_username = 2;
  string period_key = 3;
  int32 count = 4;
  int64 unix_ms = 5;
  repeated string excluded_task_ids = 6;
}

message GenerateDailyTasksResponse {
  bool generated = 1;
  repeated string task_json = 2;
  string message = 3;
}

message ClaimDailyTaskRequest {
  int32 user_id = 1;
  string minecraft_username = 2;
  string period_key = 3;
  string task_json = 4;
}

message ClaimDailyTaskResponse {
  bool claimed = 1;
  bool online = 2;
  string task_json = 3;
  string message = 4;
}

message PickDailyAdvancementRequest {
  string minecraft_username = 1;
  string period_key = 2;
  int64 unix_ms = 3;
  string excluded_advancement_id = 4;
}

message PickDailyAdvancementResponse {
  bool selected = 1;
  bool online = 2;
  string advancement_id = 3;
  string title = 4;
  string tab_title = 5;
  string icon_item = 6;
  int32 base_reward_dabloons = 7;
  int32 bonus_reward_dabloons = 8;
  string message = 9;
}

message ClaimDailyAdvancementRequest {
  string minecraft_username = 1;
  string advancement_id = 2;
  int32 bonus_reward_dabloons = 3;
  string period_key = 4;
  int64 unix_ms = 5;
  bool check_only = 6;
}

message ClaimDailyAdvancementResponse {
  bool claimed = 1;
  bool online = 2;
  bool completed = 3;
  string message = 4;
}

message PurchaseShopItemRequest {
  string minecraft_username = 1;
  string item_id = 2;
  int32 price_dabloons = 3;
  string delivery_kind = 4;
  int64 unix_ms = 5;
  string display_name = 6;
  string item_type = 7;
  string rarity = 8;
}

message PurchaseShopItemResponse {
  bool purchased = 1;
  bool online = 2;
  int32 balance_dabloons = 3;
  string message = 4;
}

message PurchaseExternalPlayerInviteRequest {
  string minecraft_username = 1;
}

message PurchaseExternalPlayerInviteResponse {
  bool purchased = 1;
  bool online = 2;
  int32 balance_dabloons = 3;
  string message = 4;
}
