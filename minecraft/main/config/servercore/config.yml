features:
    lobotomize-villagers:
        enabled: false
        tick-interval: 20

dynamic:
    enabled: false

breeding-cap:
    enabled: true
    villagers:
        limit: -1
        range: 64
        unlimited-height: false
    animals:
        limit: 64
        range: 64
        unlimited-height: false
    happy-ghasts:
        limit: 48
        range: 64
        unlimited-height: false

mob-spawning:
    categories:
        - category: 'MONSTER'
          mobcap: 70
          spawn-interval: 1
          despawn-distance: 128
        - category: 'CREATURE'
          mobcap: 16
          spawn-interval: 400
          despawn-distance: 128
        - category: 'AMBIENT'
          mobcap: 15
          spawn-interval: 1
          despawn-distance: 128
        - category: 'AXOLOTLS'
          mobcap: 5
          spawn-interval: 1
          despawn-distance: 128
        - category: 'UNDERGROUND_WATER_CREATURE'
          mobcap: 5
          spawn-interval: 1
          despawn-distance: 128
        - category: 'WATER_CREATURE'
          mobcap: 5
          spawn-interval: 1
          despawn-distance: 128
        - category: 'WATER_AMBIENT'
          mobcap: 20
          spawn-interval: 1
          despawn-distance: 64

activation-range:
    enabled: true
    use-vertical-range: true
    excluded-entity-types:
        - 'minecraft:ghast'
        - 'minecraft:hopper_minecart'
        - 'minecraft:warden'
        - 'minecraft:creaking'
