apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-data
  namespace: mc-stack-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mc-stack-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: mcstack/api
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"
            - name: API_GRPC_HOST
              value: "0.0.0.0"
            - name: API_GRPC_PORT
              value: "50051"
            - name: MOD_GRPC_TARGET
              value: "minecraft:50052"
            - name: AUTH_CODE_SECRET
              value: "dev-change-me"
            - name: COOKIE_SECURE
              value: "false"
            - name: MANUAL_EMAIL_WHITELIST
              value: ""
          ports:
            - containerPort: 8080
            - containerPort: 50051
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: api-data
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mc-stack-dev
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50051
      targetPort: 50051
