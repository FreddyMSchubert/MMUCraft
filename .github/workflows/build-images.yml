name: build-images

on:
    push:
        branches: [main]
    release:
        types: [published]

permissions:
    contents: read
    packages: write

concurrency:
    group: images-${{ github.event_name == 'release' && github.event.release.tag_name || 'dev' }}
    cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
    build:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
                  persist-credentials: false

            - name: Resolve private assets revision
              id: assets
              shell: bash
              run: echo "ref=$(git ls-tree HEAD assets | awk '{print $3}')" >> "$GITHUB_OUTPUT"

            - name: Checkout private assets at the pinned revision
              uses: actions/checkout@v6
              with:
                  repository: ${{ format('{0}_assets', github.repository) }}
                  ref: ${{ steps.assets.outputs.ref }}
                  path: assets
                  token: ${{ secrets.RESOURCE_PACK_ASSETS_PAT }}
                  persist-credentials: false

            - name: Checkout public resource-pack merger
              run: git submodule update --init --depth 1 minecraft/main/respack/ResourcePackMerger

            - name: Set up Java
              uses: actions/setup-java@v5
              with:
                  distribution: microsoft
                  java-version: '25'

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: minecraft/main/respack/items-respack-generator/package-lock.json

            - name: Generate and build Minecraft once
              working-directory: minecraft/main/mod
              run: |
                  python3 ../stage_item_data.py --root ..
                  ./gradlew runDatagen --no-daemon
                  ./gradlew build --no-daemon

            - name: Build resource pack
              run: python3 minecraft/main/respack/build-main-pack.py

            - name: Resolve image names and tag
              id: image
              shell: bash
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  tag=dev
                  if [[ "${GITHUB_EVENT_NAME}" == release ]]; then
                    tag="${RELEASE_TAG}"
                  fi
                  if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
                    echo "Release tag '$tag' is not a valid Docker tag" >&2
                    exit 1
                  fi
                  echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push API
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: services/api/Dockerfile
                  platforms: linux/amd64
                  pull: true
                  push: true
                  tags: ${{ steps.image.outputs.prefix }}-api:${{ steps.image.outputs.tag }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ steps.image.outputs.tag }}
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,mode=max,scope=api
                  provenance: mode=max
                  sbom: true

            - name: Build and push web
              uses: docker/build-push-action@v7
              with:
                  context: services/web
                  platforms: linux/amd64
                  pull: true
                  push: true
                  tags: ${{ steps.image.outputs.prefix }}-web:${{ steps.image.outputs.tag }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ steps.image.outputs.tag }}
                  cache-from: type=gha,scope=web
                  cache-to: type=gha,mode=max,scope=web
                  provenance: mode=max
                  sbom: true

            - name: Build and push Minecraft
              uses: docker/build-push-action@v7
              with:
                  context: minecraft/main
                  platforms: linux/amd64
                  pull: true
                  push: true
                  tags: ${{ steps.image.outputs.prefix }}-mc:${{ steps.image.outputs.tag }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ steps.image.outputs.tag }}
                  cache-from: type=gha,scope=mc
                  cache-to: type=gha,mode=max,scope=mc
                  provenance: mode=max
                  sbom: true
