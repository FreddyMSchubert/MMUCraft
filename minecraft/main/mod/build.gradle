import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'com.google.protobuf' version '0.9.5'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "mainmod" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    accessWidenerPath = file("src/main/resources/mainmod.accesswidener")
}

def grpcVersion = '1.69.1'
def protobufVersion = '3.25.5'
def prometheusVersion = '1.8.0'

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation include("com.google.protobuf:protobuf-java:${protobufVersion}")
    implementation include("io.grpc:grpc-api:${grpcVersion}")
    implementation include("io.grpc:grpc-core:${grpcVersion}")
    implementation include("io.grpc:grpc-context:${grpcVersion}")
    implementation include("io.grpc:grpc-netty-shaded:${grpcVersion}")
    implementation include("io.grpc:grpc-protobuf:${grpcVersion}")
    implementation include("io.grpc:grpc-stub:${grpcVersion}")
    implementation include("io.grpc:grpc-protobuf-lite:${grpcVersion}")
    implementation include("io.perfmark:perfmark-api:0.27.0")

    implementation include("io.prometheus:prometheus-metrics-core:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-model:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-config:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-tracer-initializer:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-tracer-common:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-tracer-otel:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-tracer-otel-agent:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-exporter-httpserver:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-exporter-common:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-exposition-textformats:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-exposition-formats:${prometheusVersion}")
    implementation include("io.prometheus:prometheus-metrics-instrumentation-jvm:${prometheusVersion}")

    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }

    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }

    generateProtoTasks {
        ofSourceSet('main').configureEach {
            plugins {
                grpc {}
            }
        }
    }
}

sourceSets {
    main {
        proto {
            srcDirs = [file('../../../proto')]
        }
    }
    trailCheck {
        java.srcDir 'src/check/java'
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('checkParticleTrails', JavaExec) {
    group = 'verification'
    description = 'Check trail recipes, saved data, membership filters, and flight positions.'
    classpath = sourceSets.trailCheck.runtimeClasspath
    mainClass = 'uk.co.httpsmmuminecraftsociety.mainmod.ParticleTrailsCheck'
    enableAssertions = true
    workingDir = layout.buildDirectory.dir('trailCheck').get().asFile
    doFirst { workingDir.mkdirs() }
}

tasks.register('checkPlayerColors', JavaExec) {
    group = 'verification'
    description = 'Check player RGB formatting, vanilla team colors, and persisted join colors.'
    classpath = sourceSets.trailCheck.runtimeClasspath
    mainClass = 'uk.co.httpsmmuminecraftsociety.mainmod.grpc.PlayerColorsCheck'
    enableAssertions = true
    workingDir = layout.buildDirectory.dir('playerColorsCheck').get().asFile
    doFirst { workingDir.mkdirs() }
}

tasks.named('check') {
    dependsOn tasks.named('checkPlayerColors')
    dependsOn 'checkFishing'
}

