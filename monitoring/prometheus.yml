global:
  scrape_interval: 15s

scrape_configs:
  - job_name: mainmod
    scrape_interval: 5s
    static_configs:
      - targets: ["minecraft:9100"]

  - job_name: api
    scrape_interval: 60s
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["api:8080"]

  - job_name: backup
    scrape_interval: 30s
    metrics_path: /metrics.txt
    static_configs:
      - targets: ["backup:8080"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
