syntax = "proto3";

package mcstack.gameplay.v1;

option java_multiple_files = true;
option java_package = "uk.co.httpsmmuminecraftsociety.mainmod.grpc";
option java_outer_classname = "GameplayProto";

service GameplayEvents {
  rpc UnlockNextKnowledge(UnlockNextKnowledgeRequest) returns (UnlockNextKnowledgeResponse);
  rpc GetUnlockAvailability(GetUnlockAvailabilityRequest) returns (GetUnlockAvailabilityResponse);
  rpc SyncPlayerStats(SyncPlayerStatsRequest) returns (SyncPlayerStatsResponse);
  rpc RecordMoneyEvent(RecordMoneyEventRequest) returns (RecordMoneyEventResponse);
  rpc RecordFishCatch(RecordFishCatchRequest) returns (RecordFishCatchResponse);
  rpc GetClaimsSnapshot(GetClaimsSnapshotRequest) returns (ClaimsSnapshot);
}

service GameplayControl {
  rpc GrantDailyLoginBonus(GrantDailyLoginBonusRequest) returns (GrantDailyLoginBonusResponse);
  rpc GrantGiftCodeMoney(GrantGiftCodeMoneyRequest) returns (GrantGiftCodeMoneyResponse);
  rpc SubmitDailyItems(SubmitDailyItemsRequest) returns (SubmitDailyItemsResponse);
  rpc PickDailyAdvancement(PickDailyAdvancementRequest) returns (PickDailyAdvancementResponse);
  rpc ClaimDailyAdvancement(ClaimDailyAdvancementRequest) returns (ClaimDailyAdvancementResponse);
  rpc PurchaseShopItem(PurchaseShopItemRequest) returns (PurchaseShopItemResponse);
  rpc GetCurrentClaimChunk(GetCurrentClaimChunkRequest) returns (GetCurrentClaimChunkResponse);
  rpc PurchaseClaim(PurchaseClaimRequest) returns (PurchaseClaimResponse);
  rpc ApplyClaimsSnapshot(ClaimsSnapshot) returns (ApplyClaimsSnapshotResponse);
}

message GetClaimsSnapshotRequest {}

message ClaimData {
  string id = 1;
  string dimension = 2;
  sint32 chunk_x = 3;
  sint32 chunk_z = 4;
  string owner_uuid = 5;
  string owner_name = 6;
  repeated string member_uuids = 7;
}

message ClaimsSnapshot {
  repeated ClaimData claims = 1;
}

message GetCurrentClaimChunkRequest {
  string minecraft_username = 1;
}

message GetCurrentClaimChunkResponse {
  bool online = 1;
  string dimension = 2;
  sint32 chunk_x = 3;
  sint32 chunk_z = 4;
  int32 balance_dabloons = 5;
  string message = 6;
}

message PurchaseClaimRequest {
  string minecraft_username = 1;
  string dimension = 2;
  sint32 chunk_x = 3;
  sint32 chunk_z = 4;
}

message PurchaseClaimResponse {
  bool purchased = 1;
  bool online = 2;
  int32 balance_dabloons = 3;
  string message = 4;
}

message ApplyClaimsSnapshotResponse {
  bool applied = 1;
}

message GrantGiftCodeMoneyRequest {
  string minecraft_username = 1;
  int32 amount_dabloons = 2;
  string code = 3;
  int64 unix_ms = 4;
}

message GrantGiftCodeMoneyResponse {
  bool granted = 1;
  bool online = 2;
  int32 balance_dabloons = 3;
  string message = 4;
}

message UnlockNextKnowledgeRequest {
  string minecraft_username = 1;
  string source_item_id = 2;
  int64 unix_ms = 3;
  string unlock_type = 4;
  string minecraft_uuid = 5;
}

message UnlockNextKnowledgeResponse {
  bool unlocked = 1;
  bool all_unlocked = 2;
  string knowledge_id = 3;
  int32 priority = 4;
  string topic = 5;
  string message = 6;
  string unlock_type = 7;
  string unlocked_id = 8;
  bool has_knowledge_to_unlock = 9;
  bool has_charms_to_unlock = 10;
  bool has_cosmetics_to_unlock = 11;
}

message GetUnlockAvailabilityRequest {
  string minecraft_username = 1;
  int64 unix_ms = 2;
  string minecraft_uuid = 3;
}

message GetUnlockAvailabilityResponse {
  bool account_linked = 1;
  bool has_knowledge_to_unlock = 2;
  bool has_charms_to_unlock = 3;
  bool has_cosmetics_to_unlock = 4;
  string message = 5;
}

message MinecraftStatEntry {
  string key = 1;
  string category = 2;
  string id = 3;
  string label = 4;
  int64 value = 5;
}

message SyncPlayerStatsRequest {
  string minecraft_username = 1;
  int64 unix_ms = 2;
  int32 balance_dabloons = 3;
  repeated MinecraftStatEntry stats = 4;
  string minecraft_uuid = 5;
}

message SyncPlayerStatsResponse {
  bool accepted = 1;
  bool account_linked = 2;
  string message = 3;
  bool is_member = 4;
  bool is_committee = 5;
  string nickname = 6;
  string pronouns = 7;
}

message RecordMoneyEventRequest {
  string minecraft_username = 1;
  int32 amount_dabloons = 2;
  string direction = 3;
  string source = 4;
  string reference_id = 5;
  int64 unix_ms = 6;
  int32 balance_dabloons = 7;
  string minecraft_uuid = 8;
}

message RecordMoneyEventResponse {
  bool recorded = 1;
  bool duplicate = 2;
  bool account_linked = 3;
  string message = 4;
}

message RecordFishCatchRequest {
  string minecraft_username = 1;
  string minecraft_uuid = 2;
  string fish_id = 3;
  double length_cm = 4;
  string rarity = 5;
  int64 unix_ms = 6;
}

message RecordFishCatchResponse {
  bool recorded = 1;
  bool account_linked = 2;
  bool first_catch = 3;
  bool personal_size_record = 4;
  bool server_size_record = 5;
  bool server_smallest_record = 6;
  string message = 7;
  bool personal_smallest_record = 8;
}

message GrantDailyLoginBonusRequest {
  string minecraft_username = 1;
  int32 amount = 2;
  string period_key = 3;
  int64 unix_ms = 4;
}

message GrantDailyLoginBonusResponse {
  bool granted = 1;
  bool online = 2;
  string message = 3;
}

message SubmitDailyItemsRequest {
  string minecraft_username = 1;
  string item = 2;
  int32 count = 3;
  int32 reward_dabloons = 4;
  string period_key = 5;
  int64 unix_ms = 6;
}

message SubmitDailyItemsResponse {
  bool submitted = 1;
  bool online = 2;
  int32 found_count = 3;
  string message = 4;
}

message PickDailyAdvancementRequest {
  string minecraft_username = 1;
  string period_key = 2;
  int64 unix_ms = 3;
}

message PickDailyAdvancementResponse {
  bool selected = 1;
  bool online = 2;
  string advancement_id = 3;
  string title = 4;
  string tab_title = 5;
  string icon_item = 6;
  int32 base_reward_dabloons = 7;
  int32 bonus_reward_dabloons = 8;
  string message = 9;
}

message ClaimDailyAdvancementRequest {
  string minecraft_username = 1;
  string advancement_id = 2;
  int32 bonus_reward_dabloons = 3;
  string period_key = 4;
  int64 unix_ms = 5;
}

message ClaimDailyAdvancementResponse {
  bool claimed = 1;
  bool online = 2;
  bool completed = 3;
  string message = 4;
}

message PurchaseShopItemRequest {
  string minecraft_username = 1;
  string item_id = 2;
  int32 price_dabloons = 3;
  string delivery_kind = 4;
  int64 unix_ms = 5;
}

message PurchaseShopItemResponse {
  bool purchased = 1;
  bool online = 2;
  int32 balance_dabloons = 3;
  string message = 4;
}
