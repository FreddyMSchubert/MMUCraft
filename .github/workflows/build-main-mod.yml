name: build-main-mod
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build-main-mod:
    defaults:
      run:
        shell: bash
        working-directory: ./minecraft/main/mod
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RESOURCE_PACK_ASSETS_PAT }}
      - name: checkout resource pack inputs
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.RESOURCE_PACK_ASSETS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RESOURCE_PACK_ASSETS_PAT secret is not available. It is required to clone the private assets submodule." >&2
            exit 1
          fi

          cleanup_auth() {
            git config --global --unset-all url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf || true
          }
          trap cleanup_auth EXIT

          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init minecraft/main/respack/ResourcePackMerger assets
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: minecraft/main/respack/items-respack-generator/package-lock.json
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: stage item data
        run: python3 ../stage_item_data.py --root ..
      - name: generate proto sources
        run: ./gradlew generateProto
      - name: run datagen
        run: ./gradlew runDatagen
      - name: build
        run: ./gradlew build
      - name: build merged resource pack
        working-directory: .
        run: python3 minecraft/main/respack/build-main-pack.py
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            minecraft/main/mod/build/libs/*.jar
            !minecraft/main/mod/build/libs/*-sources.jar
      - name: capture resource pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resource Pack
          path: minecraft/main/respack/packs/main-pack.zip
