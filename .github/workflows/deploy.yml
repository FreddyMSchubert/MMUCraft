name: deploy
run-name: Deploy ${{ inputs.version }} to ${{ inputs.target }}

on:
    workflow_dispatch:
        inputs:
            target:
                description: Server to update (dev or production)
                required: true
                default: dev
                type: choice
                options:
                    - dev
                    - production
            version:
                description: Build to deploy; dev = latest dev build, SHA = specific build, release tag = published release
                required: true
                default: dev
                type: string
            source_ref:
                description: Deployment files for release tags; blank uses Version. Dev and SHA use their build commit.
                required: false
                default: ''
                type: string
            warning_minutes:
                description: Wait up to this many minutes for players to leave after a warning; 0 skips the advance warning
                required: true
                default: 3
                type: number
            force:
                description: Continue if player notices, disconnects, or saving fails; all are still attempted
                required: true
                default: false
                type: boolean

permissions:
    contents: read
    packages: read

concurrency:
    group: deploy-${{ inputs.target }}
    cancel-in-progress: false

jobs:
    deploy:
        if: >-
            inputs.target == 'dev' ||
            (github.actor == 'FreddyMSchubert' && github.triggering_actor == 'FreddyMSchubert')
        runs-on: ubuntu-24.04
        environment: ${{ inputs.target }}
        env:
            DEPLOY_TARGET: ${{ inputs.target }}
            DEPLOY_VERSION: ${{ inputs.version }}
            WARNING_MINUTES: ${{ inputs.warning_minutes }}
            FORCE_DEPLOY: ${{ inputs.force }}
        steps:
            - name: Validate requested version
              id: version
              shell: bash
              env:
                  REQUESTED_VERSION: ${{ env.DEPLOY_VERSION }}
                  REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
              run: |
                  tag="$REQUESTED_VERSION"
                  ref="${REQUESTED_SOURCE_REF:-$REQUESTED_VERSION}"
                  if [[ "${tag,,}" == dev ]]; then
                    if [[ "$DEPLOY_TARGET" != dev ]]; then
                      echo "Production requires a release tag, not dev" >&2
                      exit 1
                    fi
                    tag=dev
                    ref=''
                  elif [[ "$tag" =~ ^[0-9a-fA-F]{40}$ ]]; then
                    tag="${tag,,}"
                    ref="$tag"
                  fi
                  if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
                    echo "'$tag' is not a valid image tag" >&2
                    exit 1
                  fi
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "ref=$ref" >> "$GITHUB_OUTPUT"
                  echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Verify all requested images exist
              id: images
              env:
                  IMAGE_PREFIX: ${{ steps.version.outputs.prefix }}
                  REQUESTED_TAG: ${{ steps.version.outputs.tag }}
                  REQUESTED_REF: ${{ steps.version.outputs.ref }}
              run: |
                  tag="$REQUESTED_TAG"
                  ref="$REQUESTED_REF"
                  if [[ "$tag" == dev ]]; then
                    manifest=$(docker buildx imagetools inspect --raw "${IMAGE_PREFIX}-api:dev")
                    ref=$(jq -r '.annotations["org.opencontainers.image.revision"] // empty' <<< "$manifest")
                    if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
                      echo 'The dev image does not identify a complete built commit; run checks-tests-images first' >&2
                      exit 1
                    fi
                    tag="$ref"
                  fi
                  for service in api web mc velocity waiting-room event event-controller backup; do
                    docker manifest inspect "${IMAGE_PREFIX}-${service}:${tag}" >/dev/null
                  done
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "ref=$ref" >> "$GITHUB_OUTPUT"

            - name: Checkout deployment files
              uses: actions/checkout@v6
              with:
                  ref: ${{ steps.images.outputs.ref }}
                  persist-credentials: false

            - name: Configure SSH
              env:
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
              run: |
                  test -n "$DEPLOY_SSH_KEY"
                  test -n "$DEPLOY_KNOWN_HOSTS"
                  install -d -m 700 ~/.ssh
                  printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
                  printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

            - name: Verify SSH configuration
              shell: bash
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
              run: |
                  test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST variable is empty" >&2; exit 1; }
                  [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "DEPLOY_PORT variable is invalid" >&2; exit 1; }
                  ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null || {
                    echo "DEPLOY_SSH_KEY is not a valid OpenSSH private key" >&2
                    exit 1
                  }
                  ssh-keygen -lf ~/.ssh/known_hosts >/dev/null || {
                    echo "DEPLOY_KNOWN_HOSTS is not a valid known_hosts entry" >&2
                    exit 1
                  }

                  known_host="$DEPLOY_HOST"
                  [[ "$DEPLOY_PORT" == 22 ]] || known_host="[$DEPLOY_HOST]:$DEPLOY_PORT"
                  ssh-keygen -F "$known_host" -f ~/.ssh/known_hosts >/dev/null || {
                    echo "DEPLOY_KNOWN_HOSTS has no entry for the configured host and port" >&2
                    exit 1
                  }

                  ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" true || {
                    echo "SSH files are valid and the target entry exists, but strict connection failed; the OpenSSH error above distinguishes a changed host key from rejected client authentication" >&2
                    exit 1
                  }

            - name: Copy deployment files and deploy
              shell: bash
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
                  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/mmucraft' }}
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GHCR_USER: ${{ github.actor }}
                  IMAGE_PREFIX: ${{ steps.version.outputs.prefix }}
                  IMAGE_TAG: ${{ steps.images.outputs.tag }}
              run: |
                  test -n "$DEPLOY_HOST"
                  test -n "$DEPLOY_USER"
                  [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
                  [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
                  [[ "$DEPLOY_PATH" != / && "$DEPLOY_PATH" != *..* ]]

                  ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
                    "set -eu; mkdir -p '$DEPLOY_PATH'; df -h '$DEPLOY_PATH'; df -i '$DEPLOY_PATH'; ls -ld '$DEPLOY_PATH'; if [ '$DEPLOY_TARGET' = dev ]; then docker image prune -a -f --filter until=168h >/dev/null; docker builder prune -f >/dev/null; df -h '$DEPLOY_PATH'; df -i '$DEPLOY_PATH'; fi; test -w '$DEPLOY_PATH'"
                  tar -czf - -C deploy . -C .. monitoring .env.example | \
                    ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o ServerAliveInterval=30 -o ServerAliveCountMax=3 "$DEPLOY_USER@$DEPLOY_HOST" \
                      "tar -xzf - -C '$DEPLOY_PATH' && chmod 700 '$DEPLOY_PATH/deploy.sh'"

                  printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io --username '$GHCR_USER' --password-stdin"
                  status=0
                  ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o ServerAliveInterval=30 -o ServerAliveCountMax=3 "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && ./deploy.sh '$IMAGE_TAG' '$IMAGE_PREFIX' '$WARNING_MINUTES' '$FORCE_DEPLOY' '$DEPLOY_TARGET'" || status=$?
                  ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "docker logout ghcr.io" || true
                  exit "$status"
