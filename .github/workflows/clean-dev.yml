name: clean-dev

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-dev
    cancel-in-progress: false

jobs:
    clean:
        runs-on: ubuntu-24.04
        environment: dev
        steps:
            - name: Checkout cleanup script
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Configure SSH
              env:
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
              run: |
                  test -n "$DEPLOY_SSH_KEY"
                  test -n "$DEPLOY_KNOWN_HOSTS"
                  install -d -m 700 ~/.ssh
                  printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
                  printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

            - name: Clean dev server
              shell: bash
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
                  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/mmucraft' }}
              run: |
                  test -n "$DEPLOY_HOST"
                  test -n "$DEPLOY_USER"
                  [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
                  [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
                  [[ "$DEPLOY_PATH" != / && "$DEPLOY_PATH" != *..* ]]
                  ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
                  ssh-keygen -lf ~/.ssh/known_hosts >/dev/null
                  known_host="$DEPLOY_HOST"
                  [[ "$DEPLOY_PORT" == 22 ]] || known_host="[$DEPLOY_HOST]:$DEPLOY_PORT"
                  ssh-keygen -F "$known_host" -f ~/.ssh/known_hosts >/dev/null
                  ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && bash -s -- 0 0" < deploy/clean-dev.sh
