processResources {
    dependsOn "generateMiniBlockRecipes"
    inputs.property "version", project.version
    inputs.file("../data/gameplay-toggles.json")

    from("../data/gameplay-toggles.json") {
        into "data/mainmod"
    }

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

def miniBlockCatalog = file("src/main/resources/data/mainmod/miniblocks.json")
def generatedMiniBlockResources = layout.buildDirectory.dir("generated/miniblockResources")
def generatedMasteryResources = layout.buildDirectory.dir("generated/masteryResources")

tasks.register("generateMiniBlockRecipes") {
    inputs.file(miniBlockCatalog)
    outputs.dir(generatedMiniBlockResources)

    doLast {
        File resourceRoot = generatedMiniBlockResources.get().asFile
        File recipeDirectory = new File(resourceRoot, "data/mainmod/recipe/miniblocks")
        delete(recipeDirectory)
        recipeDirectory.mkdirs()

        List<Map<String, String>> definitions = new JsonSlurper().parse(miniBlockCatalog) as List<Map<String, String>>
        Set<String> ids = new HashSet<>()

        definitions.each { definition ->
            for (String field : ["id", "input", "name", "texture"]) {
                if (!(definition[field] instanceof String) || definition[field].isBlank()) {
                    throw new GradleException("Mini block definition is missing string field '${field}'")
                }
            }
            if (!ids.add(definition.id)) {
                throw new GradleException("Duplicate mini block id: ${definition.id}")
            }

            Map<String, Object> recipe = [
                    type      : "minecraft:stonecutting",
                    ingredient: definition.input,
                    result    : [
                            id        : "minecraft:player_head",
                            count     : 8,
                            components: [
                                    "minecraft:profile"  : [
                                            properties: [[name: "textures", value: definition.texture]]
                                    ],
                                    "minecraft:item_name": definition.name,
                                    "minecraft:rarity"   : "common"
                            ]
                    ]
            ]

            File recipeFile = new File(recipeDirectory, "${definition.id}.json")
            recipeFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(recipe)) + System.lineSeparator()
        }
    }
}

sourceSets.main.resources.srcDir(generatedMiniBlockResources)
sourceSets.main.resources.srcDir(generatedMasteryResources)

tasks.register("generateMasteryAdvancements") {
    inputs.dir(file("../data/data/items"))
    outputs.dir(generatedMasteryResources)

    doLast {
        File directory = new File(generatedMasteryResources.get().asFile, "data/mainmod/advancement/mastery")
        delete(directory)
        directory.mkdirs()

        Map<String, Map<String, Object>> itemDefinitions = [:]
        fileTree("../data/data/items").matching { include "**/item.json" }.files.each { itemFile ->
            Map<String, Object> definition = new JsonSlurper().parse(itemFile) as Map<String, Object>
            if (definition.id instanceof String) itemDefinitions[definition.id] = definition
        }
        def iconFor = { String icon ->
            if (icon.startsWith("fake:")) {
                String itemId = icon.substring(5)
                Map<String, Object> definition = itemDefinitions[itemId]
                if (definition == null) throw new GradleException("Unknown advancement icon item: ${itemId}")
                String baseItem = definition.baseItemOverride ?: (definition.equippableCosmetic != null
                        ? "minecraft:carved_pumpkin" : "minecraft:command_block")
                return [
                        id: baseItem,
                        components: ["minecraft:custom_model_data": [strings: [itemId]]]
                ]
            }
            if (icon.startsWith("enderite:")) {
                return [
                        id: "minecraft:${icon.substring(9)}",
                        components: ["minecraft:custom_model_data": [flags: [true]]]
                ]
            }
            return [id: icon]
        }
        def writeAdvancement = { String path, String title, String description, String icon, String parent, String frame ->
            Map<String, Object> display = [
                    icon       : iconFor(icon),
                    title      : title,
                    description: description,
                    frame      : frame,
                    show_toast : path != "root",
                    announce_to_chat: path != "root",
                    hidden     : false
            ]
            if (path == "root") display.background = "minecraft:textures/block/enderite_block.png"
            Map<String, Object> advancement = [
                    display: display,
                    criteria: [done: [trigger: "minecraft:impossible"]],
                    requirements: [["done"]],
                    sends_telemetry_event: false
            ]
            if (parent != null) advancement.parent = "mainmod:mastery/${parent}"

            File output = new File(directory, "${path}.json")
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(advancement)) + System.lineSeparator()
        }

        writeAdvancement("root", "MMU Mastery", "Master every corner of MMUCraft.", "fake:coin-100", null, "task")

        List<List<String>> advancements = [
                ["fishing/first_catch", "Something's Fishy", "Catch a fish.", "minecraft:fishing_rod", "root", "task"],
