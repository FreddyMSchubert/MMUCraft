apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: mc-stack-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: mcstack/web
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: API_BASE_URL
              value: http://api:8080
            - name: WATCHPACK_POLLING
              value: "true"
            - name: CHOKIDAR_USEPOLLING
              value: "true"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: mc-stack-dev
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
