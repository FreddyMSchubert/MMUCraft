tasks.named('check') {
    dependsOn 'checkMapResize', 'checkThunderRitual', 'checkInsomniaPhantoms', 'checkFarmingBoots', 'checkSpiderPajamas', 'checkMasteryDropGates', 'checkGearEnchantments', 'checkSmithingArmor', 'checkHopperFilterIdentity',
            'checkDailyCatalog', 'checkFishingBounces', 'checkFishRarity', 'checkTeleportCompanions', 'checkTickRate', 'checkExplosiveFire'
}

def generatedResources = file("src/main/generated")

processResources {
    dependsOn "generateMiniBlockRecipes"
    exclude "data/mainmod/advancement/mastery/**"
    exclude { it.file.toPath().startsWith(generatedResources.toPath()) }
    inputs.property "version", project.version
    inputs.file("../data/drops.json")

    from("../data/drops.json") {
        into "data/mainmod/dont_edit_auto_generated"
    }

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

def miniBlockCatalog = file("src/main/resources/data/mainmod/miniblocks.json")
def generatedMiniBlockResources = layout.buildDirectory.dir("generated/miniblockResources")

tasks.register("generateMiniBlockRecipes") {
    inputs.file(miniBlockCatalog)
    outputs.dir(generatedMiniBlockResources)

    doLast {
        File resourceRoot = generatedMiniBlockResources.get().asFile
        File recipeDirectory = new File(resourceRoot, "data/mainmod/recipe/miniblocks")
        delete(recipeDirectory)
        recipeDirectory.mkdirs()

        List<Map<String, String>> definitions = new JsonSlurper().parse(miniBlockCatalog) as List<Map<String, String>>
        Set<String> ids = new HashSet<>()

        definitions.each { definition ->
            for (String field : ["id", "input", "name", "texture"]) {
                if (!(definition[field] instanceof String) || definition[field].isBlank()) {
                    throw new GradleException("Mini block definition is missing string field '${field}'")
                }
            }
            if (!ids.add(definition.id)) {
                throw new GradleException("Duplicate mini block id: ${definition.id}")
            }

            Map<String, Object> recipe = [
                    type      : "minecraft:stonecutting",
                    ingredient: definition.input,
                    result    : [
                            id        : "minecraft:player_head",
                            count     : 8,
                            components: [
                                    "minecraft:profile"  : [
                                            properties: [[name: "textures", value: definition.texture]]
                                    ],
                                    "minecraft:item_name": definition.name,
                                    "minecraft:rarity"   : "common"
                            ]
                    ]
            ]

            File recipeFile = new File(recipeDirectory, "${definition.id}.json")
            recipeFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(recipe)) + System.lineSeparator()
        }
    }
}

sourceSets.main.resources.srcDir(generatedMiniBlockResources)

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a SourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    dependsOn "runDatagen"
    from(generatedResources) {
        include "data/**"
    }
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

fabricApi {
    configureDataGeneration() {
        client = true
    }
}

tasks.named("sourcesJar") {
    dependsOn tasks.named("runDatagen")
}

