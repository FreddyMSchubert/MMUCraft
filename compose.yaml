name: kubecraft

x-logging: &logging
  driver: local
  options:
    max-size: 20m
    max-file: "5"

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: dev
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      API_GRPC_HOST: 0.0.0.0
      API_GRPC_PORT: 50051
      MOD_GRPC_TARGET: minecraft:50052
      DATABASE_URL: ./data/app.sqlite
      DATABASE_MIGRATIONS_PATH: ./drizzle
      AUTH_CODE_SECRET: ${AUTH_CODE_SECRET:-dev-change-me}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: "${RESEND_FROM:-MMU Minecraft Society <onboarding@resend.dev>}"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_AVATAR_BASE_URL: ${DISCORD_AVATAR_BASE_URL:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      VELOCITY_API_SECRET: ${VELOCITY_API_SECRET:-dev-velocity-api-secret}
    ports:
      - "8080:8080"
      - "4983:4983"
    volumes:
      - ./services/api/src:/app/src
      - ./services/api/drizzle:/app/drizzle
      - ./services/api/drizzle.config.ts:/app/drizzle.config.ts
      - ./services/api/tsconfig.json:/app/tsconfig.json
      - ./services/web/public/knowledge:/app/content/knowledge
      - ./minecraft/main/data/data/items:/app/content/items
      - ./proto:/app/proto
      - ./.dev/api:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging
    restart: unless-stopped

  web:
    build:
      context: services/web
      target: dev
    environment:
      API_BASE_URL: http://api:8080
      GRAFANA_BASE_URL: http://grafana:3000
      SITE_IMAGE_TAG: dev
      DISCORD_URL: ${DISCORD_URL:-https://discord.gg/pPgZqRS5b2}
      INSTAGRAM_URL: ${INSTAGRAM_URL:-https://www.instagram.com/mmuminecraftsociety/}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./services/web/src:/app/src
      - ./services/web/public:/app/public
      - ./services/web/next.config.ts:/app/next.config.ts
      - ./services/web/tsconfig.json:/app/tsconfig.json
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging
    restart: unless-stopped

  velocity:
    image: mcstack/velocity:dev
    build:
      context: services/velocity
    stdin_open: true
    tty: true
    environment:
      CFG_VELOCITY_FORWARDING_SECRET: ${VELOCITY_FORWARDING_SECRET:-dev-velocity-forwarding-secret}
      VELOCITY_API_SECRET: ${VELOCITY_API_SECRET:-dev-velocity-api-secret}
      MMU_API_BASE_URL: http://api:8080
    ports:
      - "25565:25565"
    volumes:
      - ./.dev/velocity:/server
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

  minecraft:
    profiles: [minecraft]
    image: mcstack/minecraft-server:dev
    build:
      context: minecraft/main
    stdin_open: true
    tty: true
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "26.2"
      MODRINTH_PROJECTS: fabric-api,fabricproxy-lite:2.12.0
      MEMORY: 2G
      INIT_MEMORY: 1G
      STOP_DURATION: "110"
      OVERRIDE_SERVER_PROPERTIES: "false"
      SKIP_SERVER_PROPERTIES: "true"
      COPY_CONFIG_DEST: /data
      SYNC_SKIP_NEWER_IN_DESTINATION: "true"
      MOD_GRPC_HOST: 0.0.0.0
      MOD_GRPC_PORT: 50052
      API_GRPC_TARGET: api:50051
      FABRIC_PROXY_SECRET: ${VELOCITY_FORWARDING_SECRET:-dev-velocity-forwarding-secret}
    volumes:
      - ./.dev/minecraft:/data
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 10s
      start_interval: 1s
      timeout: 5s
      retries: 12
      start_period: 2m

  prometheus:
    profiles: [minecraft]
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
      - --log.level=warn
    volumes:
      - ./monitoring/prometheus-dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      minecraft:
        condition: service_started
    logging: *logging
    restart: unless-stopped

  grafana:
    profiles: [minecraft]
    image: grafana/grafana:13.1.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_LOG_LEVEL: warn
      GF_SERVER_ROOT_URL: http://localhost:3000/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/gameplay.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./monitoring/grafana/provisioning/dashboards/private.yml:/etc/grafana/provisioning/dashboards/main.yml:ro
      - ./monitoring/grafana/dashboards/admin:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    logging: *logging
    restart: unless-stopped

  loki:
    profiles: [minecraft]
    image: grafana/loki:3.7.6
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    logging: *logging
    restart: unless-stopped

  alloy:
    profiles: [minecraft]
    image: grafana/alloy:v1.18.0
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
    logging: *logging
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
