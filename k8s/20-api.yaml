apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mc-stack-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: mcstack/api
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
            - name: PUBLIC_WEB_BASE_URL
              value: http://127.0.0.1:3000
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mc-stack-dev
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
