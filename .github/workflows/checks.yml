name: checks-tests-images

on:
    workflow_dispatch:
        inputs:
            release_tag:
                description: Published release tag to publish images under; blank publishes dev and commit-SHA image tags.
                required: false
                default: ''
                type: string
            source_ref:
                description: Code to build (branch, tag, or commit); defaults to main.
                required: true
                default: main
                type: string
    release:
        types: [published]

permissions:
    contents: read
    packages: write

concurrency:
    group: checks-tests-images-${{ inputs.release_tag || github.event.release.tag_name || inputs.source_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
    verify-and-publish:
        runs-on: ubuntu-24.04
        steps:
            - name: Validate manual release tag
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
              id: manual_release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              run: |
                  if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
                    echo "'$RELEASE_TAG' is not a valid Docker tag" >&2
                    exit 1
                  fi
                  release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
                  if ! jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false and .published_at != null' <<< "$release" >/dev/null; then
                    echo "'$RELEASE_TAG' is not a published release" >&2
                    exit 1
                  fi
                  echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
                  echo "name=$(jq -r '(.name // .tag_name) | gsub("[\r\n]"; " ")' <<< "$release")" >> "$GITHUB_OUTPUT"
                  echo "url=$(jq -r '.html_url' <<< "$release")" >> "$GITHUB_OUTPUT"

            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.source_ref || 'main' }}
                  persist-credentials: false

            - name: Resolve source revision
              id: source
              run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.12'

            - name: Check image fingerprinting
              run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

            - name: Install data-schema validator
              run: python3 -m pip install --requirement minecraft/main/data/validation/requirements.txt

            - name: Validate data definitions
              run: python3 minecraft/main/data/validation/validate.py --root minecraft/main

            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      services/api/package-lock.json
                      services/web/package-lock.json
                      minecraft/main/respack/items-respack-generator/package-lock.json

            - name: Install dependencies
              run: |
                  npm ci
                  npm ci --prefix services/api
                  npm ci --prefix services/web
                  npm ci --prefix minecraft/main/respack/items-respack-generator

            - name: Check formatting (advisory)
              run: |
                  if ! npm run format:check; then
                    echo '::warning::Formatting differs from Prettier output.'
                  fi

            - name: Check source
              run: npm run check

            - name: Lint backup shell script
              run: shellcheck services/backup/backup-manager.sh

            - name: Verify backups are production-only
              env:
                  IMAGE_PREFIX: ghcr.io/example/server
                  IMAGE_TAG: dev
                  PUBLIC_HOST: example.org
                  MONITORING_CONFIG_PATH: ./monitoring
              run: |
                  dev_services=$(docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml --env-file .env.example config --services)
                  if printf '%s\n' "$dev_services" | grep -qx backup; then
                    echo 'The backup service must not be present in the dev Compose configuration.' >&2
                    exit 1
                  fi
                  docker compose -f deploy/compose.yaml -f deploy/compose.prod.yaml --env-file .env.example config --services | grep -qx backup

            - name: Validate backup monitoring configuration
              run: |
                  python3 -m json.tool monitoring/grafana/dashboards/admin/backups.json >/dev/null
                  docker run --rm --entrypoint /bin/promtool \
                    -v "$PWD/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
                    prom/prometheus:v3.14.0 check config /etc/prometheus/prometheus.yml

            - name: Audit dependencies
              env:
                  npm_config_loglevel: http
              run: |
                  for project in . services/api services/web minecraft/main/respack/items-respack-generator; do
                    echo "Audit $project"
                    npm audit --prefix "$project" --omit=dev --audit-level=high --json || {
                      echo "Audit failed for $project. Retry once."
                      npm audit --prefix "$project" --omit=dev --audit-level=high --json
                    }
                  done

            - name: Resolve private assets revision
              if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
              id: assets
              shell: bash
              run: echo "ref=$(git ls-tree HEAD assets | awk '{print $3}')" >> "$GITHUB_OUTPUT"

            - name: Checkout private assets at the pinned revision
              if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
              uses: actions/checkout@v6
              with:
                  repository: ${{ format('{0}_assets', github.repository) }}
                  ref: ${{ steps.assets.outputs.ref }}
                  path: assets
                  token: ${{ secrets.RESOURCE_PACK_ASSETS_PAT }}
                  persist-credentials: false

            - name: Checkout public resource-pack merger
              if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
              run: git submodule update --init --depth 1 minecraft/main/respack/ResourcePackMerger

            - name: Set up Java
              if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
              uses: actions/setup-java@v5
              with:
                  distribution: microsoft
                  java-version: '25'

            - name: Build resource pack
              if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
              run: python3 minecraft/main/respack/build-main-pack.py

            - name: Resolve image names and tag
              if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
              id: image
              shell: bash
              env:
                  RELEASE_TAG: ${{ steps.manual_release.outputs.tag || github.event.release.tag_name }}
              run: |
                  tag=dev
                  if [[ -n "$RELEASE_TAG" ]]; then
                    tag="${RELEASE_TAG}"
                    if [[ "${tag,,}" == dev ]]; then
                      echo "'dev' is reserved for development images" >&2
                      exit 1
                    fi
                  fi
                  if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
                    echo "Release tag '$tag' is not a valid Docker tag" >&2
                    exit 1
                  fi
                  echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
              uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Find reusable API and web images
              id: front_images
              shell: bash
              env:
                  IMAGE_PREFIX: ${{ steps.image.outputs.prefix }}
                  SITE_RELEASE_NAME: ${{ steps.manual_release.outputs.name || github.event.release.name }}
                  SITE_RELEASE_URL: ${{ steps.manual_release.outputs.url || github.event.release.html_url }}
                  SITE_DEPLOY_TARGET: ${{ steps.image.outputs.tag == 'dev' && 'dev' || 'production' }}
              run: python3 .github/scripts/image_fingerprint.py api web

            - name: Build API for tests
              if: ${{ steps.front_images.outputs.api_exists != 'true' }}
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: services/api/Dockerfile
                  platforms: linux/amd64
                  pull: true
                  push: true
                  tags: ${{ steps.front_images.outputs.api_image }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,mode=max,scope=api
                  provenance: mode=max
                  sbom: true

            - name: Build web for tests
              if: ${{ steps.front_images.outputs.web_exists != 'true' }}
              uses: docker/build-push-action@v7
              with:
                  context: services/web
                  platforms: linux/amd64
                  pull: true
                  push: true
                  tags: ${{ steps.front_images.outputs.web_image }}
                  build-args: |
                      SITE_RELEASE_NAME=${{ steps.manual_release.outputs.name || github.event.release.name }}
                      SITE_RELEASE_URL=${{ steps.manual_release.outputs.url || github.event.release.html_url }}
                      SITE_DEPLOY_TARGET=${{ steps.image.outputs.tag == 'dev' && 'dev' || 'production' }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
                  cache-from: type=gha,scope=web
                  cache-to: type=gha,mode=max,scope=web
                  provenance: mode=max
                  sbom: true

            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: Run isolated Playwright tests
              env:
                  COMPOSE_PROJECT_NAME: kubecraft-playwright-${{ github.run_id }}-${{ github.run_attempt }}
                  PLAYWRIGHT_API_IMAGE: ${{ steps.front_images.outputs.api_image }}
                  PLAYWRIGHT_WEB_IMAGE: ${{ steps.front_images.outputs.web_image }}
              run: npm test

            - name: Upload Playwright diagnostics
              if: ${{ failure() && !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: |
                      tests/playwright-report
                      tests/test-results
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Reclaim test image and build cache space
              if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
              run: |
                  docker image prune --all --force
                  docker buildx prune --all --force
                  df -h .

            - name: Set up Gradle
              if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
              uses: gradle/actions/setup-gradle@v6

            - name: Build Minecraft
              if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
              working-directory: minecraft/main/mod
              run: |
                  python3 ../stage_item_data.py --root ..
                  ./gradlew build --no-daemon
                  ./gradlew -p ../../../services/velocity/plugin build --no-daemon
                  ./gradlew -p ../../../minecraft/waiting-room/plugin build --no-daemon

            - name: Find reusable Minecraft and service images
              id: back_images
              shell: bash
              env:
                  IMAGE_PREFIX: ${{ steps.image.outputs.prefix }}
              run: python3 .github/scripts/image_fingerprint.py mc velocity waiting-room backup

            - name: Build and push Minecraft
              if: ${{ steps.back_images.outputs.mc_exists != 'true' }}
              uses: docker/build-push-action@v7
              with:
                  context: minecraft/main
                  platforms: linux/amd64
                  pull: true
                  push: true
                  tags: ${{ steps.back_images.outputs.mc_image }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
                  cache-from: type=gha,scope=mc
                  cache-to: type=gha,mode=max,scope=mc
                  provenance: mode=max
                  sbom: true

            - name: Build and push Velocity
              if: ${{ steps.back_images.outputs.velocity_exists != 'true' }}
              uses: docker/build-push-action@v7
              with:
                  context: services/velocity
                  platforms: linux/amd64
                  pull: true
                  push: true
                  tags: ${{ steps.back_images.outputs.velocity_image }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
                  cache-from: type=gha,scope=velocity
                  cache-to: type=gha,mode=max,scope=velocity
                  provenance: mode=max
                  sbom: true

            - name: Reclaim Minecraft build cache space
              if: ${{ steps.back_images.outputs.mc_exists != 'true' || steps.back_images.outputs.velocity_exists != 'true' }}
              run: |
                  docker buildx prune --all --force
                  df -h .

            - name: Build and push waiting room
              if: ${{ steps.back_images.outputs.waiting_room_exists != 'true' }}
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: minecraft/waiting-room/Dockerfile
                  platforms: linux/amd64
                  pull: true
                  push: true
                  tags: ${{ steps.back_images.outputs.waiting_room_image }}
                  cache-from: type=gha,scope=waiting-room
                  cache-to: type=gha,mode=max,scope=waiting-room
                  provenance: mode=max
                  sbom: true

            - name: Reclaim waiting-room build cache space
              if: ${{ steps.back_images.outputs.waiting_room_exists != 'true' }}
              run: |
                  docker buildx prune --all --force
                  df -h .

            - name: Build and push backup manager
              if: ${{ steps.back_images.outputs.backup_exists != 'true' }}
              uses: docker/build-push-action@v7
              with:
                  context: services/backup
                  platforms: linux/amd64
                  pull: true
                  push: true
                  tags: ${{ steps.back_images.outputs.backup_image }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
                  cache-from: type=gha,scope=backup
                  cache-to: type=gha,mode=max,scope=backup
                  provenance: mode=max
                  sbom: true

            - name: Publish tested image set
              shell: bash
              env:
                  IMAGE_PREFIX: ${{ steps.image.outputs.prefix }}
                  IMAGE_TAG: ${{ steps.image.outputs.tag }}
                  SOURCE_SHA: ${{ steps.source.outputs.sha }}
                  API_IMAGE: ${{ steps.front_images.outputs.api_image }}
                  WEB_IMAGE: ${{ steps.front_images.outputs.web_image }}
                  MC_IMAGE: ${{ steps.back_images.outputs.mc_image }}
                  VELOCITY_IMAGE: ${{ steps.back_images.outputs.velocity_image }}
                  WAITING_ROOM_IMAGE: ${{ steps.back_images.outputs.waiting_room_image }}
                  BACKUP_IMAGE: ${{ steps.back_images.outputs.backup_image }}
              run: |
                  for service in api web mc velocity waiting-room backup; do
                    key=${service^^}
                    key=${key//-/_}
                    source_variable=${key}_IMAGE
                    if [[ "$IMAGE_TAG" == dev ]]; then
                      docker buildx imagetools create \
                        --tag "${IMAGE_PREFIX}-${service}:${SOURCE_SHA}" \
                        "${!source_variable}"
                    else
                      docker buildx imagetools create \
                        --tag "${IMAGE_PREFIX}-${service}:${IMAGE_TAG}" \
                        "${!source_variable}"
                    fi
                  done
                  if [[ "$IMAGE_TAG" == dev ]]; then
                    # Publish the API alias last. Its revision annotation points to a complete SHA-tagged set.
                    for service in web mc velocity waiting-room backup api; do
                      key=${service^^}
                      key=${key//-/_}
                      source_variable=${key}_IMAGE
                      if [[ "$service" == api ]]; then
                        docker buildx imagetools create \
                          --annotation "index:org.opencontainers.image.revision=${SOURCE_SHA}" \
                          --tag "${IMAGE_PREFIX}-${service}:dev" \
                          "${!source_variable}"
                      else
                        docker buildx imagetools create \
                          --tag "${IMAGE_PREFIX}-${service}:dev" \
                          "${!source_variable}"
                      fi
                    done
                  fi
